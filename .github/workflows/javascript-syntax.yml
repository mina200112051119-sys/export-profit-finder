name: JavaScript syntax check

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - 'index.html'
      - '.github/workflows/javascript-syntax.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.js'
      - 'index.html'
      - '.github/workflows/javascript-syntax.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript files
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Check inline JavaScript in index.html
        run: node scripts/check-inline-js.cjs
      - name: Test official product search API
        run: node --test tests/*.test.js
