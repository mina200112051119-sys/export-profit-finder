name: Build ranking base

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ranking base to index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          ui_old = '<div id="ranking"></div>'
          ui_new = '''<div class="card" style="margin-top:12px"><button class="primary" type="button" onclick="refreshRanking()">🔄 おすすめを更新</button><div id="rankingStatus" class="muted" style="margin-top:8px;text-align:center">サンプルデータでランキングを表示中</div></div>
          <div id="ranking"></div>'''
          if 'id="rankingStatus"' not in s:
              s = s.replace(ui_old, ui_new, 1)
          start = s.index('function renderCats()')
          end = s.index('function detail', start)
          ranking = '''const rankingState={data:products,source:"試作サンプル",updatedAt:new Date()};
          function rankingScore(p){const fee=currentFeeRate();const profit=Math.round(p.sell*(1-fee)-p.ship-p.cost);const margin=p.cost>0?profit/p.cost:0;const demand=p.sold/Math.max(p.list,1);const trend=p.trend==="上昇"?1:0;const risk=p.risk==="低"?1:p.risk==="中"?.5:0;return {profit,margin,demand,score:profit/1000+Math.min(demand,4)*1.5+trend*2+risk}}
          function rankedItems(list){return list.map(p=>({...p,...rankingScore(p)})).sort((a,b)=>b.score-a.score)}
          function renderCats(){let cats=[...new Set(rankingState.data.map(p=>p.cat))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat" onclick="renderRank('${c}')"><b>${c}</b><small>${rankingState.data.filter(p=>p.cat===c).length}件｜おすすめを見る</small></button>`).join('')}
          function rankingCard(p,i){return `<div class="card product" role="button" tabindex="0" onclick="detailByName(${JSON.stringify(p.name)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();detailByName(${JSON.stringify(p.name)})}"><span class="rank">#${i+1}</span> <span class="badge">${i<3?'注目候補':'おすすめ候補'}</span><h3>${p.name}</h3><div class="row"><span>予想利益</span><b class="${p.profit>=0?'green':'red'}">${p.profit>=0?'+':''}${p.profit.toLocaleString()}円</b></div><div class="row"><span>販売・出品比</span><b>${Math.round(p.demand*100)}%</b></div><div class="row"><span>リスク</span><b>${p.risk}</b></div><div class="muted" style="margin-top:8px;text-align:right">タップして詳細を見る ›</div></div>`}
          function renderOverallRank(){const arr=rankedItems(rankingState.data).slice(0,10);document.getElementById('ranking').innerHTML=`<div class="card"><h2>全カテゴリー｜おすすめTOP10</h2><p class="muted">順位は「利益・売れやすさ・価格の動き・リスク」を組み合わせた試作スコアです。完成版では最新データを同じ計算に流し込みます。</p>${arr.map(rankingCard).join('')}</div>`}
          function renderRank(cat){const arr=rankedItems(rankingState.data.filter(p=>p.cat===cat));document.getElementById('ranking').innerHTML=`<div class="card"><h2>${cat}｜おすすめ</h2><p class="muted">この順位計算は、あとで最新のeBay等のデータを入れ替えられるように分離しています。</p>${arr.map(rankingCard).join('')}</div>`}
          async function loadRankingData(){const url=window.RANKING_DATA_URL||'';if(!url){rankingState.data=products;rankingState.source='試作サンプル';rankingState.updatedAt=new Date();return false}const r=await fetch(url);if(!r.ok)throw new Error('ランキングデータ取得に失敗しました');const data=await r.json();const items=Array.isArray(data.items)?data.items:[];if(!items.length)throw new Error('ランキングデータが空です');rankingState.data=items;rankingState.source=data.source||'外部データ';rankingState.updatedAt=new Date();return true}
          async function refreshRanking(){const status=document.getElementById('rankingStatus');status.textContent='おすすめデータを更新しています…';try{const live=await loadRankingData();renderCats();renderOverallRank();const t=rankingState.updatedAt.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});status.textContent=`データ：${rankingState.source}${live?'（外部取得）':'（試作）'}｜最終更新：${t}`}catch(e){rankingState.data=products;renderCats();renderOverallRank();status.textContent=`最新データ取得に失敗しました。試作データを表示中｜${e.message}`}}
          '''
          s = s[:start] + ranking + s[end:]
          if 'function detailByName(name)' not in s:
              marker = 'function detail'
              helper = 'function detailByName(name){const p=rankingState.data.find(x=>x.name===name)||products.find(x=>x.name===name);if(p)detail(p)}\n'
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit ranking base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix ranking product detail action"
          git push origin HEAD:main
