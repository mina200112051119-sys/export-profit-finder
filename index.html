<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export Profit Finder - 試作</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f6f8;color:#222}
header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}header p{margin:5px 0 0;font-size:12px;color:#cbd5e1}
main{max-width:900px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
button,.tab{border:0;border-radius:12px;padding:12px;background:white;box-shadow:0 1px 4px #0001;font-weight:700;cursor:pointer}
.tab.active{background:#111827;color:white}.panel{display:none}.panel.active{display:block}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{padding:16px;text-align:left}.cat small{display:block;color:#64748b;margin-top:4px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 10px}.small-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px}.metric b{font-size:18px}.warning{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px;font-size:12px;margin-top:10px}
.primary{background:#2563eb;color:white;width:100%;margin-top:4px}.muted{color:#64748b;font-size:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}.profit{font-size:26px;font-weight:800}.green{color:#15803d}.yellow{color:#a16207}.red{color:#b91c1c}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}
.stars{letter-spacing:2px}.rank{font-size:12px;color:#64748b}.product{cursor:pointer}.product:hover{transform:translateY(-1px)}
.notice{background:#eff6ff;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}
.preview{max-height:180px;max-width:100%;border-radius:12px;margin-top:8px;display:none}
.result{margin-top:12px}.hidden{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.tabs{position:sticky;top:68px;background:#f5f6f8;padding:5px 0;z-index:4}}
</style>
<style id="fuzzy-card-search-style">
.fuzzy-candidates{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}
.fuzzy-card{border:1px solid #ddd;border-radius:14px;padding:12px;background:#fff}
.fuzzy-card img{width:100%;height:250px;object-fit:contain;border-radius:10px;background:#f5f5f5}
.fuzzy-card .meta{font-size:13px;color:#666;margin:6px 0}.fuzzy-card button{width:100%;margin-top:8px}
.match-badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eee;font-size:12px}
.detail-card-image{width:min(100%,360px);max-height:520px;object-fit:contain;border-radius:14px;background:#f5f5f5;display:block;margin:10px auto}.image-fallback{padding:28px;text-align:center;background:#f5f5f5;border-radius:14px;color:#64748b;margin:10px auto}
.search-hint{font-size:13px;color:#666;margin-top:6px}
</style>
</head>
<body>
<header><h1>Export Profit Finder</h1><p>輸出せどり支援ツール｜試作版・データはサンプルです</p></header>
<main>
<div class="tabs">
<button class="tab active" onclick="showTab('recommend',this)">今おすすめ</button>
<button class="tab" onclick="showTab('search',this)">商品検索</button>
<button class="tab" onclick="showTab('photo',this)">写真から探す</button>
</div>
<section id="recommend" class="panel active"><div class="card"><h2>今おすすめの商品</h2><div class="notice">※試作版のため、現在の為替・eBay・仕入れ先データはサンプルです。実運用では最新データに更新します。</div><div class="grid" id="cats"></div></div><div id="ranking"></div></section>
<section id="search" class="panel"><div class="card"><h2>商品名・型番から検索</h2><label>カテゴリー</label><select id="searchCat"><option>ポケモンカード</option><option>ポケモン関連サプライ用品</option><option>釣具</option><option>カメラ</option><option>レトロゲーム</option></select><label>商品名・型番</label><input id="searchName" placeholder="例：ポケモンカード 151 BOX"><label>仕入れ価格（円）</label><input id="searchCost" type="number" value="8000"><label>目標利益（円）</label><input id="targetProfit" type="number" value="3000"><div class="notice">「目標利益」を残せる金額までを、仕入れ上限の目安として計算します。</div><button class="primary" onclick="searchProduct()">利益と仕入れ上限を計算する</button><div id="searchResult" class="result"></div></div></section>
<section id="photo" class="panel"><div class="card"><h2>写真から商品を探す</h2><div class="notice">写真をアップロード → 商品候補を確認 → ユーザーが確定、という安全設計の試作です。</div><input type="file" accept="image/*" onchange="previewPhoto(event)"><img id="preview" class="preview"><div id="photoCandidate" class="result hidden"></div></div></section>
<div id="detail"></div>
</main>
<script>
const products=[
{name:"ポケモンカード 151 BOX",cat:"ポケモンカード",cost:8000,sell:15000,ship:1800,sold:84,list:29,trend:"安定",source:"メルカリ",risk:"低",image:"https://www.thetrainercourt.com/cdn/shop/files/pokemon-151-japanese-booster-box.jpg?v=1732606922&width=596"},

{name:"ポケモンカード インフェルノX BOX",cat:"ポケモンカード",cost:6500,sell:11800,ship:1800,sold:61,list:27,trend:"上昇",source:"ヤフオク",risk:"低",image:"https://ec.treasure-f.com/images/1042009001663054/1500/1042009001663054_01_0500w.jpeg"},
{name:"ポケモンカード 30周年記念関連 BOX",cat:"ポケモンカード",cost:7200,sell:13500,ship:1800,sold:54,list:31,trend:"上昇",source:"ポケモンセンターオンライン",risk:"低",image:"https://www.pokemoncenter-online.com/a/img/item/9900000008284/M/a14cc0392043215b995fdbdd41d9aa81030b791a403cdebfbbb4e908e30a64e5.jpg"},
{name:"ポケモンカード 人気プロモカード",cat:"ポケモンカード",cost:4200,sell:7900,ship:900,sold:48,list:42,trend:"安定",source:"メルカリ",risk:"中"},
{name:"ポケモン デッキシールド 限定品",cat:"ポケモン関連サプライ用品",cost:2200,sell:7800,ship:1500,sold:46,list:18,trend:"上昇",source:"ポケモンセンターオンライン",risk:"低",image:"https://i.ebayimg.com/images/g/Y3gAAOSwjX9kPZkl/s-l500.jpg"},
{name:"ポケモン プレイマット 限定品",cat:"ポケモン関連サプライ用品",cost:3500,sell:9200,ship:2200,sold:39,list:17,trend:"安定",source:"ポケモンセンターオンライン",risk:"低"},
{name:"ポケモン デッキケース 限定品",cat:"ポケモン関連サプライ用品",cost:1800,sell:5200,ship:1500,sold:31,list:21,trend:"安定",source:"ポケモンセンターオンライン",risk:"中"},
{name:"ポケモン カードファイル",cat:"ポケモン関連サプライ用品",cost:2500,sell:5900,ship:1800,sold:28,list:25,trend:"安定",source:"メルカリ",risk:"中"},
{name:"ポケモン コレクション収納用品",cat:"ポケモン関連サプライ用品",cost:1600,sell:4800,ship:1500,sold:35,list:19,trend:"上昇",source:"ヤフオク",risk:"低"},
{name:"SHIMANO 人気リール",cat:"釣具",cost:18000,sell:31500,ship:4500,sold:43,list:26,trend:"安定",source:"ヤフオク",risk:"低",image:"https://stat.ameba.jp/user_images/20260523/18/e-shopstoyama/12/ef/j/o1080072015785336254.jpg?caw=800"},
{name:"DAIWA 人気リール",cat:"釣具",cost:14000,sell:26500,ship:4300,sold:38,list:29,trend:"安定",source:"メルカリ",risk:"中",image:"https://cdn-ak.f.st-hatena.com/images/fotolife/p/popopoppun/20240722/20240722125019.jpg"},
{name:"人気ルアー 限定カラー",cat:"釣具",cost:4500,sell:8500,ship:1700,sold:31,list:22,trend:"安定",source:"ヤフオク",risk:"中"},
{name:"日本限定フィッシングプライヤー",cat:"釣具",cost:5200,sell:9900,ship:1900,sold:29,list:16,trend:"上昇",source:"メルカリ",risk:"低"},
{name:"釣具用小型アクセサリー",cat:"釣具",cost:2400,sell:5200,ship:1400,sold:24,list:18,trend:"安定",source:"ヤフオク",risk:"中"},
{name:"Canon 人気フィルムカメラ",cat:"カメラ",cost:18000,sell:32000,ship:4500,sold:25,list:31,trend:"安定",source:"メルカリ",risk:"中",image:"https://cdn.assets.lomography.com/a1/3c928ad8ce813dd4f86d0d494db7236b3fd839/1216x972x2.jpg?auth=8fd0f67e3c8259226a76adfeefcb4d3903c1de81"},
{name:"Nikon 人気レンズ",cat:"カメラ",cost:22000,sell:41000,ship:4500,sold:34,list:24,trend:"上昇",source:"ヤフオク",risk:"低",image:"https://shop.topcamera.co.jp/site/html/upload/save_image/24571781.jpg"},
{name:"FUJIFILM 人気レンズ",cat:"カメラ",cost:28000,sell:52000,ship:5000,sold:29,list:22,trend:"上昇",source:"メルカリ",risk:"低",image:"https://www.fujiya-camera.co.jp/img/goods/L/C2120143687710_l.jpg"},
{name:"Sony ミラーレス用レンズ",cat:"カメラ",cost:24000,sell:43000,ship:4800,sold:27,list:25,trend:"安定",source:"ヤフオク",risk:"中"},
{name:"フィルムカメラ用レンズ",cat:"カメラ",cost:12000,sell:24500,ship:3500,sold:36,list:30,trend:"安定",source:"メルカリ",risk:"中"},
{name:"ゲームボーイ用 人気ソフト",cat:"レトロゲーム",cost:3500,sell:7500,ship:1800,sold:57,list:20,trend:"上昇",source:"ヤフオク",risk:"低"},
{name:"スーパーファミコン 人気ソフト",cat:"レトロゲーム",cost:2800,sell:6900,ship:1800,sold:44,list:24,trend:"安定",source:"メルカリ",risk:"低",image:"https://image.invaluable.com/housePhotos/ejsauction/03/766903/H8897-L366502082_original.jpg"},
{name:"ゲームボーイカラー 本体",cat:"レトロゲーム",cost:9000,sell:17500,ship:2800,sold:33,list:29,trend:"安定",source:"ヤフオク",risk:"中",image:"https://sasugaya.jp/wp/wp-content/uploads/2021/01/IMG_5717.jpg"},
{name:"ファミコン 人気ソフト",cat:"レトロゲーム",cost:2200,sell:5800,ship:1800,sold:41,list:32,trend:"安定",source:"メルカリ",risk:"中"},
{name:"Nintendo 64 人気ソフト",cat:"レトロゲーム",cost:3000,sell:7200,ship:1900,sold:35,list:26,trend:"上昇",source:"ヤフオク",risk:"低"}
];
let feeRate=.14, fx=148;
function profit(p,sell=p.sell){return Math.round(sell*(1-feeRate)-p.ship-p.cost)}
function score(p){return Math.max(1,Math.min(5,Math.round((p.sold/(p.list+1))*1.2+(p.risk==="低"?1.2:p.risk==="中"?.6:0))))}
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('detail').innerHTML=''}
function renderCats(){document.getElementById('cats').innerHTML=[...new Set(products.map(p=>p.cat))].map(c=>`<button class="cat" onclick="renderRank('${c}')">📦 ${c}<small>おすすめを見る</small></button>`).join('')}
function renderRank(cat){let arr=products.filter(p=>p.cat===cat).sort((a,b)=>profit(b)-profit(a));document.getElementById('ranking').innerHTML=`<div class="card"><h2>${cat}｜今のおすすめ</h2><p class="muted">試作では予想利益を中心に並べています。完成版では売れやすさ・価格安定・仕入れ状況・リスクも含めて順位を決めます。</p>${arr.map((p,i)=>`<div class="card product" onclick='detail(${JSON.stringify(p)})'><span class="rank">#${i+1}</span><h3>${p.name}</h3><div class="row"><span>予想利益</span><b class="${profit(p)>=0?'green':'red'}">${profit(p).toLocaleString()}円</b></div><div class="row"><span>売れ行き</span><span>${p.sold}件 / 出品${p.list}件</span></div><div class="row"><span>リスク</span><span>${p.risk}</span></div></div>`).join('')}</div>`}
function currentFeeRate(){let v=Number(document.getElementById('marketFee')?.value);return Number.isFinite(v)&&v>=0&&v<=100?v/100:feeRate}
function detail(p){let fee=currentFeeRate(),customSell=Number(document.getElementById('marketSell')?.value||0),customShip=Number(document.getElementById('marketShip')?.value||0),calcSell=customSell>0?customSell:p.sell,calcShip=customShip>0?customShip:p.ship,calcProfit=Math.round(calcSell*(1-fee)-calcShip-p.cost),target=Number(document.getElementById('targetProfit')?.value||3000),maxCost=Math.max(0,Math.floor(calcSell*(1-fee)-calcShip-target)),minSell=Math.max(0,Math.ceil((p.cost+calcShip+target)/(1-fee))),safety=Math.round(((maxCost-p.cost)/Math.max(maxCost,1))*100);let image=p.image?`<img class="detail-card-image" src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';document.getElementById('imageFallback').style.display='block';">`:`<div id="imageFallback" class="image-fallback">商品画像は準備中です</div>`;document.getElementById('detail').innerHTML=`<div class="card"><h2>商品詳細</h2>${image}<div id="imageFallback" class="image-fallback" style="display:none">商品画像は準備中です</div><h3>${p.name}</h3><div class="row"><span>仕入れ先</span><b>${p.source}</b></div><div class="row"><span>仕入れ価格</span><b>${p.cost.toLocaleString()}円</b></div><div class="row"><span>eBay想定価格</span><b>${calcSell.toLocaleString()}円</b></div><div class="row"><span>海外送料</span><b>${calcShip.toLocaleString()}円</b></div><div class="row"><span>販売手数料率</span><b>${(fee*100).toFixed(1)}%</b></div><div class="row"><span>想定利益</span><b class="profit ${calcProfit>=0?'green':'red'}">${calcProfit>=0?'+':''}${calcProfit.toLocaleString()}円</b></div><div class="metric">目標利益 ${target.toLocaleString()}円を残すための<br><b>仕入れ上限目安 ${maxCost.toLocaleString()}円</b><div class="muted">この金額以下なら、現在の想定販売価格・送料・手数料で目標利益を残せる計算です。</div></div><div class="metric">🛒 仕入れ判断<br><b class="${p.cost<=maxCost?'green':'red'}">${p.cost<=maxCost?'この価格なら買い候補':'この価格では見送り'}</b><div class="muted">仕入れ価格 ${p.cost.toLocaleString()}円 / 上限 ${maxCost.toLocaleString()}円</div></div><div class="metric">💰 目標販売価格<br><b>${minSell.toLocaleString()}円</b><div class="muted">仕入れ価格と送料を前提に、目標利益を残すために必要な販売価格です。</div></div><div class="metric">📊 市場メモ<br><span>90日販売 ${p.sold}件 / 現在出品 ${p.list}件 / トレンド ${p.trend} / リスク ${p.risk}</span></div></div>`;window.scrollTo({top:document.getElementById('detail').offsetTop-10,behavior:'smooth'})}
function searchProduct(){let cat=document.getElementById('searchCat').value,name=document.getElementById('searchName').value.trim(),cost=Number(document.getElementById('searchCost').value||0),target=Number(document.getElementById('targetProfit').value||0);let p=products.find(x=>x.cat===cat&&x.name.includes(name))||products.find(x=>x.cat===cat);if(!p){document.getElementById('searchResult').innerHTML='<div class="warning">候補商品がありません。商品名を少し短くして検索してください。</div>';return}p={...p,cost};let maxCost=Math.max(0,Math.floor(p.sell*(1-feeRate)-p.ship-target));document.getElementById('searchResult').innerHTML=`<div class="metric"><b>${p.name}</b><div class="row"><span>想定利益</span><b class="${profit(p)>=0?'green':'red'}">${profit(p).toLocaleString()}円</b></div><div class="row"><span>仕入れ上限目安</span><b>${maxCost.toLocaleString()}円</b></div></div><button class="primary" onclick='detail(${JSON.stringify(p)})'>商品詳細を見る</button>`}
function previewPhoto(e){let f=e.target.files?.[0];if(!f)return;let u=URL.createObjectURL(f);document.getElementById('preview').src=u;document.getElementById('preview').style.display='block';let box=document.getElementById('photoCandidate');box.classList.remove('hidden');box.innerHTML=`<div class="metric"><b>AI候補（試作）</b><p>写真から候補を推定しました。最終確定はユーザーが行います。</p><button class="primary" onclick="confirmPhoto()">この候補を確定</button></div>`}
function confirmPhoto(){detail(products[0])}
function marketQuery(){let n=document.getElementById('searchName')?.value?.trim()||products[0].name;return n}
function openMarketSearch(){window.open('https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent(marketQuery()),'_blank')}
async function copyMarketQuery(){let q=marketQuery();try{await navigator.clipboard.writeText(q);document.getElementById('ebayApiStatus').textContent='検索ワードをコピーしました';}catch(e){document.getElementById('ebayApiStatus').textContent='コピーできませんでした';}}
function median(values){let a=values.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:Math.round((a[m-1]+a[m])/2)}
function applyMarketMedian(){let vals=['marketP1','marketP2','marketP3','marketP4'].map(id=>Number(document.getElementById(id)?.value||0)).filter(v=>v>0);let m=median(vals);if(!m)return;document.getElementById('marketSell').value=m;document.getElementById('marketStats').textContent='観測値の中央値：'+m.toLocaleString()+'円';}
async function fetchEbayMarket(){let q=marketQuery(),status=document.getElementById('ebayApiStatus'),box=document.getElementById('ebayResults'),endpoint=window.EBAY_API_URL||'';if(!endpoint){status.textContent='eBay APIエンドポイントが未設定です。手動入力でも使えます。';return}status.textContent='eBayから取得中…';box.innerHTML='';try{let r=await fetch(endpoint+'?q='+encodeURIComponent(q));let data=await r.json();if(!r.ok)throw new Error(data.error||'API error');let items=data.items||[];if(!items.length){status.textContent='候補が見つかりませんでした。';return}let prices=items.map(x=>Number(x.priceJpy||x.price*fx)).filter(v=>v>0);let ships=items.map(x=>Number(x.shippingJpy||x.shipping*fx)).filter(v=>v>0);let m=median(prices);if(m)document.getElementById('marketSell').value=m;let sm=median(ships);if(sm)document.getElementById('marketShip').value=sm;items.slice(0,5).forEach(x=>{let d=document.createElement('div');d.className='metric';d.innerHTML='<b>'+String(x.title||'').replace(/[<>]/g,'')+'</b><div>価格：'+Number(x.priceJpy||x.price*fx).toLocaleString()+'円</div>'+(x.url?'<a href="'+x.url+'" target="_blank" rel="noopener">eBayで見る</a>':'');box.appendChild(d)});status.textContent='eBayから'+items.length+'件取得。中央値を販売価格に反映しました。';}catch(e){status.textContent='取得エラー：'+e.message+'（手動入力に切り替えられます）';}}
function initMarketUI(){let d=document.getElementById('detail');if(!d)return;let old=d.innerHTML;}
renderCats();
window.EBAY_API_URL='https://export-profit-finder-api.vercel.app/api/ebay-search';
</script>
</body>
</html>
