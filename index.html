<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><title>輸出せどり利益計算ツール</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f6f8;color:#222}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:20px}header p{margin:5px 0 0;font-size:12px;color:#cbd5e1}main{max-width:900px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.tab,button{border:0;border-radius:12px;padding:12px;background:#fff;box-shadow:0 1px 4px #0001;font-weight:700;cursor:pointer}.tab.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{padding:16px;text-align:left}.cat small{display:block;color:#64748b;margin-top:4px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 10px}.primary{background:#2563eb;color:#fff;width:100%;margin-top:4px}.secondary{background:#e5e7eb;color:#111827;width:100%;margin-top:8px}.muted{color:#64748b;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}.green{color:#15803d}.red{color:#b91c1c}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.notice{background:#eff6ff;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}.result{margin-top:12px}.search-product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.search-product-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;cursor:pointer}.status{background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px}.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(900px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.close{background:#e5e7eb;padding:8px 12px}.detail-image{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#f8fafc;margin:10px 0}.detail-profit{font-size:24px;font-weight:900;margin:10px 0}.detail-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}.detail-actions a{display:block;text-align:center;text-decoration:none;padding:12px;border-radius:12px;background:#111827;color:#fff;font-weight:700}.tap-note{color:#64748b;font-size:12px;text-align:right;margin-top:8px}@media(max-width:600px){.grid,.search-product-grid,.settings-grid{grid-template-columns:1fr}.tabs{position:sticky;top:68px;background:#f5f6f8;padding:5px 0;z-index:4}}</style></head><body><header><h1>輸出せどり利益計算ツール</h1><p>海外販売の商品探し・利益計算をサポート</p></header><main><div class="tabs"><button class="tab active" onclick="showTab('recommend',this)">おすすめ</button><button class="tab" onclick="showTab('search',this)">商品を検索</button><button class="tab" onclick="showTab('photo',this)">写真から探す</button></div><section id="recommend" class="panel active"><div class="card"><h2>データ更新状況</h2><div id="updateStatus" class="status">読み込み中…</div><button class="primary" onclick="manualRefresh()">🔄 今すぐ更新・すべて再計算</button></div><div class="card"><h2>おすすめの商品</h2><div class="notice">利益計算には為替、eBay手数料、海外手数料、注文固定費を反映します。</div><div class="grid" id="cats"></div></div><div class="card" style="margin-top:12px"><button class="primary" type="button" onclick="refreshRanking()">🔄 おすすめを更新</button><div id="rankingStatus" class="muted" style="margin-top:8px;text-align:center">サンプルデータでランキングを表示中</div></div>
<div id="ranking"></div></section><section id="search" class="panel"><div class="card"><h2>商品名・型番から検索</h2><label>カテゴリー</label><select id="searchCat" onchange="updateFeeNote()"><option>ポケモンカード</option><option>ポケモン関連サプライ用品</option><option>釣具</option><option>カメラ</option><option>レトロゲーム</option></select><label>商品名・型番</label><input id="searchName" placeholder="例：ポケモンカード151 リザードン"><label>仕入れ価格（円）</label><input id="searchCost" type="number" value="8000"><label>目標利益（円）</label><input id="targetProfit" type="number" value="3000"><div id="fxDisplay" class="status">為替を取得中…</div><div id="feeNote" class="muted">eBay米国・ストアなしを想定</div><button class="primary" onclick="searchProduct()">eBayで検索して利益を計算</button><div id="searchResult" class="result"></div></div></section><section id="photo" class="panel"><div class="card"><h2>写真から商品を探す</h2><div class="notice">写真をアップロードすると商品候補を表示する準備ができます。</div><input type="file" accept="image/*" onchange="previewPhoto(event)"><img id="preview" style="max-width:100%;max-height:220px;display:none;margin-top:8px;border-radius:12px"><div id="photoCandidate" class="result"></div></div></section><section class="card"><h2>利益計算の設定</h2><div class="settings-grid"><div><label>国内送料（円）</label><input id="domesticShipping" type="number" value="0" onchange="saveSettings();recalculateAll()"></div><div><label>梱包費（円）</label><input id="packaging" type="number" value="0" onchange="saveSettings();recalculateAll()"></div><div><label>その他経費（円）</label><input id="otherCost" type="number" value="0" onchange="saveSettings();recalculateAll()"></div><div><label>為替換算手数料（%）</label><input id="conversionFee" type="number" value="0" step="0.01" onchange="saveSettings();recalculateAll()"></div></div><div class="muted">為替は1日1回自動更新します。更新ボタンを押せば、いつでも最新値を取得して再計算できます。</div></section></main><div id="detailModal" class="modal-backdrop" onclick="closeDetail(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2 id="detailTitle">商品詳細</h2><button class="close" onclick="closeDetail()">閉じる</button></div><div id="detailBody"></div></div></div><script>
const API_URL=window.EBAY_API_URL||'/api/ebay-search';const FX_API='/api/exchange-rate';const FEE={"ポケモンカード":.1325,"ポケモン関連サプライ用品":.136,"釣具":.136,"カメラ":.136,"レトロゲーム":.136};const INTERNATIONAL=.0135,ORDER_FEE_USD=.40;let products=[],fxRate=150,fxDate='',lastUpdated='',detailProducts=[],searchDetailProducts=[],currentRankingTitle='';
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));const p=document.getElementById(id);if(p)p.classList.add('active');if(btn)btn.classList.add('active')}
function feeRate(cat){return FEE[cat]??.136}function yen(v){return Math.round(Number(v||0)).toLocaleString()+'円'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function loadSettings(){['domesticShipping','packaging','otherCost','conversionFee'].forEach(id=>{const v=localStorage.getItem(id),e=document.getElementById(id);if(v!==null&&e)e.value=v})}function saveSettings(){['domesticShipping','packaging','otherCost','conversionFee'].forEach(id=>{const e=document.getElementById(id);if(e)localStorage.setItem(id,e.value)})}
function calc(p,cost,cat){const saleUsd=Number(p.sell||0),shipUsd=Number(p.ship||0),totalUsd=saleUsd+shipUsd,finalValue=totalUsd*feeRate(cat),international=totalUsd*INTERNATIONAL,fixed=ORDER_FEE_USD,conv=Number(document.getElementById('conversionFee')?.value||0)/100,revenue=saleUsd*fxRate,shipping=shipUsd*fxRate,fxCharge=(revenue+shipping)*conv,eBayFees=(finalValue+international+fixed)*fxRate+fxCharge,local=Number(document.getElementById('domesticShipping')?.value||0)+Number(document.getElementById('packaging')?.value||0)+Number(document.getElementById('otherCost')?.value||0);return{revenueJpy:revenue,shipJpy:shipping,feeJpy:eBayFees,profit:Math.round(revenue-shipping-eBayFees-Number(cost||0)-local),finalValueJpy:finalValue*fxRate,internationalJpy:international*fxRate,fixedJpy:fixed*fxRate,localJpy:local,fxChargeJpy:fxCharge}}
function normalize(x,cat,cost){return{name:x.name||x.title||'商品',cat,cost,sell:Number(x.sell||x.price||0),ship:Number(x.ship||x.shipping||0),image:x.image||x.imageUrl||'',url:x.url||'',sold:Number(x.sold||0),list:Number(x.list||0),trend:x.trend||'不明',risk:x.risk||'要確認',source:x.source||x.supplier||''}}
function updateFeeNote(){const c=document.getElementById('searchCat').value;document.getElementById('feeNote').textContent=`eBay米国・ストアなしを想定：落札手数料${(feeRate(c)*100).toFixed(2)}%＋海外手数料1.35%＋注文固定0.40米ドル`}
function scoreParts(p){const x=calc(p,p.cost,p.cat),demand=p.sold/Math.max(p.list,1);return{x,demand}}function score(p){const{x,demand}=scoreParts(p);return x.profit/1000+Math.min(demand,4)*1.5+(p.trend==='上昇'?2:0)+(p.risk==='低'?1:p.risk==='中'?.5:0)}function productKey(p){return p.url||`${p.cat}|${p.name}|${p.sell}|${p.ship}`}
function ranked(list){return list.map((p,i)=>({...p,_index:i,_score:score(p),profit:calc(p,p.cost,p.cat).profit})).sort((a,b)=>b._score-a._score||b.profit-a.profit||(b.sold/Math.max(b.list,1))-(a.sold/Math.max(a.list,1))||a.name.localeCompare(b.name,'ja')||productKey(a).localeCompare(productKey(b),'ja'))}
const rankingState={data:products,source:"試作サンプル",updatedAt:new Date()};
function rankingScore(p){const fee=currentFeeRate();const profit=Math.round(p.sell*(1-fee)-p.ship-p.cost);const margin=p.cost>0?profit/p.cost:0;const demand=p.sold/Math.max(p.list,1);const trend=p.trend==="上昇"?1:0;const risk=p.risk==="低"?1:p.risk==="中"?.5:0;return {profit,margin,demand,score:profit/1000+Math.min(demand,4)*1.5+trend*2+risk}}
function rankedItems(list){return list.map(p=>({...p,...rankingScore(p)})).sort((a,b)=>b.score-a.score)}
function renderCats(){let cats=[...new Set(rankingState.data.map(p=>p.cat))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat" onclick="renderRank('${c}')"><b>${c}</b><small>${rankingState.data.filter(p=>p.cat===c).length}件｜おすすめを見る</small></button>`).join('')}
function rankingCard(p,i){return `<div class="card product" role="button" tabindex="0" onclick="detailByName(${JSON.stringify(p.name)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();detailByName(${JSON.stringify(p.name)})}"><span class="rank">#${i+1}</span> <span class="badge">${i<3?'注目候補':'おすすめ候補'}</span><h3>${p.name}</h3><div class="row"><span>予想利益</span><b class="${p.profit>=0?'green':'red'}">${p.profit>=0?'+':''}${p.profit.toLocaleString()}円</b></div><div class="row"><span>販売・出品比</span><b>${Math.round(p.demand*100)}%</b></div><div class="row"><span>リスク</span><b>${p.risk}</b></div><div class="muted" style="margin-top:8px;text-align:right">タップして詳細を見る ›</div></div>`}
function renderOverallRank(){const arr=rankedItems(rankingState.data).slice(0,10);document.getElementById('ranking').innerHTML=`<div class="card"><h2>全カテゴリー｜おすすめTOP10</h2><p class="muted">順位は「利益・売れやすさ・価格の動き・リスク」を組み合わせた試作スコアです。完成版では最新データを同じ計算に流し込みます。</p>${arr.map(rankingCard).join('')}</div>`}
function renderRank(cat){const arr=rankedItems(rankingState.data.filter(p=>p.cat===cat));document.getElementById('ranking').innerHTML=`<div class="card"><h2>${cat}｜おすすめ</h2><p class="muted">この順位計算は、あとで最新のeBay等のデータを入れ替えられるように分離しています。</p>${arr.map(rankingCard).join('')}</div>`}
async function loadRankingData(){const url=window.RANKING_DATA_URL||'';if(!url){rankingState.data=products;rankingState.source='試作サンプル';rankingState.updatedAt=new Date();return false}const r=await fetch(url);if(!r.ok)throw new Error('ランキングデータ取得に失敗しました');const data=await r.json();const items=Array.isArray(data.items)?data.items:[];if(!items.length)throw new Error('ランキングデータが空です');rankingState.data=items;rankingState.source=data.source||'外部データ';rankingState.updatedAt=new Date();return true}
async function refreshRanking(){const status=document.getElementById('rankingStatus');status.textContent='おすすめデータを更新しています…';try{const live=await loadRankingData();renderCats();renderOverallRank();const t=rankingState.updatedAt.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});status.textContent=`データ：${rankingState.source}${live?'（外部取得）':'（試作）'}｜最終更新：${t}`}catch(e){rankingState.data=products;renderCats();renderOverallRank();status.textContent=`最新データ取得に失敗しました。試作データを表示中｜${e.message}`}}
function detailByName(name){const p=rankingState.data.find(x=>x.name===name)||products.find(x=>x.name===name);if(p)detail(p)}
function detailHtml(p){const x=calc(p,p.cost,p.cat);return `${p.image?`<img class="detail-image" src="${esc(p.image)}" alt="商品画像">`:''}<div class="muted">カテゴリー：${esc(p.cat)}</div><div class="detail-profit ${x.profit>=0?'green':'red'}">${x.profit>=0?'+':''}${yen(x.profit)}</div><div class="row"><span>仕入れ価格</span><b>${yen(p.cost)}</b></div><div class="row"><span>販売価格</span><b>${yen(x.revenueJpy)}</b></div><div class="row"><span>海外送料</span><b>${yen(x.shipJpy)}</b></div><div class="row"><span>eBay落札手数料</span><b>${yen(x.finalValueJpy)}</b></div><div class="row"><span>海外手数料</span><b>${yen(x.internationalJpy)}</b></div><div class="row"><span>注文固定費</span><b>${yen(x.fixedJpy)}</b></div><div class="row"><span>為替換算手数料</span><b>${yen(x.fxChargeJpy)}</b></div><div class="row"><span>国内送料・梱包・その他</span><b>${yen(x.localJpy)}</b></div><div class="row"><span>販売実績</span><b>${p.sold||0}件</b></div><div class="row"><span>出品数</span><b>${p.list||0}件</b></div><div class="row"><span>価格トレンド</span><b>${esc(p.trend)}</b></div><div class="row"><span>リスク</span><b>${esc(p.risk)}</b></div>${p.source?`<div class="row"><span>仕入れ先</span><b>${esc(p.source)}</b></div>`:''}<div class="notice">計算は現在の為替と設定した経費を使っています。eBay手数料はカテゴリーやストア条件などで実際と異なる場合があります。</div>${p.url?`<div class="detail-actions"><a href="${esc(p.url)}" target="_blank" rel="noopener">eBayの商品ページを見る</a></div>`:''}`}
function card(p,i){const x=calc(p,p.cost,p.cat);return `<div class="card" role="button" tabindex="0" onclick="openDetail(detailProducts[${i}])" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetail(detailProducts[${i}])}"><span class="muted">#${i+1}</span> <span class="badge">${i<3?'注目候補':'おすすめ候補'}</span><h3>${esc(p.name)}</h3><div class="row"><span>予想利益</span><b class="${x.profit>=0?'green':'red'}">${x.profit>=0?'+':''}${yen(x.profit)}</b></div><div class="row"><span>販売価格</span><b>${yen(x.revenueJpy)}</b></div><div class="row"><span>eBay関連手数料</span><b>${yen(x.feeJpy)}</b></div><div class="row"><span>リスク</span><b>${esc(p.risk)}</b></div><div class="tap-note">タップして詳細を見る ›</div></div>`}
function renderList(title,list){const arr=ranked(list).slice(0,10);detailProducts=arr;currentRankingTitle=title;const box=document.getElementById('ranking');if(!box)return;if(!arr.length){box.innerHTML='<div class="card"><div class="notice">このカテゴリーには現在表示できる商品がありません。</div></div>';return}box.innerHTML=`<div class="card"><h2>${esc(title)}</h2><p class="muted">利益・売れやすさ・価格の動き・リスクを組み合わせて順位を表示しています。</p>${arr.map((p,i)=>card(p,i)).join('')}</div>`}
function renderOverall(){const cats=[...new Set(products.map(p=>p.cat).filter(Boolean))];renderList(cats.length>1?'全カテゴリー｜おすすめTOP10':`${cats[0]||'おすすめ'}｜おすすめTOP10`,products)}function renderRank(cat){renderList(`${cat}｜おすすめ`,products.filter(p=>p.cat===cat))}function recalculateAll(){if(products.length){renderCats();const cats=[...new Set(products.map(p=>p.cat).filter(Boolean))];if(currentRankingTitle&&cats.length===1&&currentRankingTitle.startsWith(cats[0]))renderRank(cats[0]);else renderOverall()}updateFxDisplay()}
function updateFxDisplay(){const e=document.getElementById('fxDisplay');if(e)e.textContent=`現在の計算レート：1 USD = ${fxRate.toFixed(2)}円｜為替基準日：${fxDate||'—'}`}function updateStatus(message=''){const e=document.getElementById('updateStatus');if(!e)return;const next=lastUpdated?new Date(new Date(lastUpdated).getTime()+86400000):null;e.innerHTML=`<div><b>最終更新：</b>${lastUpdated?new Date(lastUpdated).toLocaleString('ja-JP'):'—'}</div><div><b>為替基準日：</b>${fxDate||'—'}</div><div><b>次回自動更新：</b>${next?next.toLocaleString('ja-JP'):'アプリ起動時に確認'}</div>${message?`<div class="muted" style="margin-top:6px">${esc(message)}</div>`:''}`}
async function updateFx(force=false){const savedAt=Number(localStorage.getItem('fxFetchedAt')||0),savedRate=Number(localStorage.getItem('fxRate')||0),savedDate=localStorage.getItem('fxDate')||'';if(!force&&savedRate&&Date.now()-savedAt<86400000){fxRate=savedRate;fxDate=savedDate;lastUpdated=localStorage.getItem('lastUpdated')||new Date(savedAt).toISOString();updateStatus();updateFxDisplay();return false}try{const r=await fetch(FX_API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();if(!d.rate)throw 0;fxRate=Number(d.rate);fxDate=d.date||new Date().toISOString().slice(0,10);lastUpdated=new Date().toISOString();localStorage.setItem('fxRate',fxRate);localStorage.setItem('fxDate',fxDate);localStorage.setItem('fxFetchedAt',Date.now());localStorage.setItem('lastUpdated',lastUpdated);updateStatus();updateFxDisplay();return true}catch(e){if(savedRate){fxRate=savedRate;fxDate=savedDate;lastUpdated=localStorage.getItem('lastUpdated')||'';updateStatus('最新為替を取得できないため、保存済みレートを使用しています。')}else{lastUpdated=new Date().toISOString();updateStatus('為替を取得できないため、仮のレートを使用しています。')}updateFxDisplay();return false}}
async function manualRefresh(){const b=document.querySelector('#recommend .primary');if(b){b.disabled=true;b.textContent='⏳ 更新中…'}try{await updateFx(true);await refreshRanking();recalculateAll()}finally{if(b){b.disabled=false;b.textContent='🔄 今すぐ更新・すべて再計算'}}}
async function refreshRanking(){try{const r=await fetch(API_URL+'?q=Pokemon%20151%20Charizard',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();const items=(d.items||[]).map(x=>normalize(x,'ポケモンカード',8000)).filter(x=>x.name);if(items.length){products=items;updateStatus('eBayライブデータを取得しました（現在はポケモンカード検索を使用）。');renderCats();renderOverall();return true}}catch(e){}if(!products.length)products=sampleProducts();updateStatus('eBayライブデータを取得できないため、試作データを表示しています。');renderCats();renderOverall();return false}
async function searchProduct(){const q=document.getElementById('searchName').value.trim(),cat=document.getElementById('searchCat').value,cost=Number(document.getElementById('searchCost').value||0),target=Number(document.getElementById('targetProfit').value||0),box=document.getElementById('searchResult');if(!q){box.innerHTML='<div class="notice">商品名・型番を入力してください。</div>';return}box.innerHTML='<div class="notice">eBayを検索しています…</div>';try{const r=await fetch(API_URL+'?q='+encodeURIComponent(q),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();const items=(d.items||[]).map(x=>normalize(x,cat,cost));if(!items.length)throw 0;searchDetailProducts=items.slice(0,10);box.innerHTML='<div class="notice">eBay検索結果 '+items.length+'件。現在の為替と経費で再計算しています。</div><div class="search-product-grid">'+searchDetailProducts.map((p,i)=>{const x=calc(p,cost,cat),max=Math.max(0,Math.floor(x.revenueJpy-x.shipJpy-x.feeJpy-target));return `<div class="search-product-card" role="button" tabindex="0" onclick="openSearchDetail(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSearchDetail(${i})}"><h3>${esc(p.name)}</h3><div class="row"><span>販売価格</span><b>${yen(x.revenueJpy)}</b></div><div class="row"><span>送料</span><b>${yen(x.shipJpy)}</b></div><div class="row"><span>eBay関連手数料</span><b>${yen(x.feeJpy)}</b></div><div class="row"><span>予想利益</span><b class="${x.profit>=0?'green':'red'}">${yen(x.profit)}</b></div><div class="row"><span>目標利益を残せる仕入れ上限</span><b>${yen(max)}</b></div><div class="tap-note">タップして詳細を見る ›</div></div>`}).join('')+'</div>';return}catch(e){box.innerHTML='<div class="notice">eBayから結果を取得できませんでした。APIの設定を確認してください。</div>'}}
function openSearchDetail(i){openDetail(searchDetailProducts[i])}function closeDetail(e){const m=document.getElementById('detailModal');if(e&&e.target!==m)return;m.classList.remove('open')}function previewPhoto(e){const f=e.target.files?.[0];if(!f)return;const img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block';document.getElementById('photoCandidate').innerHTML='<div class="notice">写真を受け取りました。商品候補の自動判定は次の段階で追加できます。</div>'}
function sampleProducts(){return[{name:'ポケモンカード151 ボックス',cat:'ポケモンカード',cost:8000,sell:100,ship:12,sold:84,list:29,trend:'安定',risk:'低',source:'試作データ'},{name:'リザードンex SAR',cat:'ポケモンカード',cost:9800,sell:117,ship:6,sold:72,list:35,trend:'上昇',risk:'低',source:'試作データ'},{name:'人気カメラレンズ',cat:'カメラ',cost:22000,sell:273,ship:30,sold:34,list:24,trend:'上昇',risk:'低',source:'試作データ'},{name:'ゲームボーイ 人気ソフト',cat:'レトロゲーム',cost:3500,sell:50,ship:12,sold:57,list:20,trend:'上昇',risk:'低',source:'試作データ'}]}
async function boot(){loadSettings();updateFeeNote();products=sampleProducts();renderCats();renderOverall();await updateFx(false);await refreshRanking();recalculateAll()}boot();
</script></body></html>
