<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Export Profit Finder</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f6f8;color:#222}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:20px}header p{margin:5px 0 0;font-size:12px;color:#cbd5e1}main{max-width:900px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.tab,button{border:0;border-radius:12px;padding:12px;background:#fff;box-shadow:0 1px 4px #0001;font-weight:700;cursor:pointer}.tab.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{padding:16px;text-align:left}.cat small{display:block;color:#64748b;margin-top:4px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 10px}.primary{background:#2563eb;color:#fff;width:100%;margin-top:4px}.muted{color:#64748b;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}.profit{font-size:26px;font-weight:800}.green{color:#15803d}.red{color:#b91c1c}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.notice{background:#eff6ff;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}.warning{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px;font-size:12px;margin-top:10px}.result{margin-top:12px}.search-product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.search-product-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px}.detail-card-image{width:min(100%,360px);max-height:520px;object-fit:contain;border-radius:14px;background:#f5f5f5;display:block;margin:10px auto}@media(max-width:600px){.grid,.search-product-grid{grid-template-columns:1fr}.tabs{position:sticky;top:68px;background:#f5f6f8;padding:5px 0;z-index:4}}
</style></head>
<body><header><h1>Export Profit Finder</h1><p>輸出せどり支援ツール</p></header><main>
<div class="tabs"><button class="tab active" onclick="showTab('recommend',this)">今おすすめ</button><button class="tab" onclick="showTab('search',this)">商品検索</button><button class="tab" onclick="showTab('photo',this)">写真から探す</button></div>
<section id="recommend" class="panel active"><div class="card"><h2>今おすすめの商品</h2><div class="notice">eBayの最新データを取得できた場合はライブ情報を表示します。利益計算は日本住所のセラー向け海外手数料1.35%を含めます。</div><div class="grid" id="cats"></div></div><div class="card"><button class="primary" onclick="refreshRanking()">🔄 おすすめを更新</button><div id="rankingStatus" class="muted" style="margin-top:8px;text-align:center">読み込み中…</div></div><div id="ranking"></div></section>
<section id="search" class="panel"><div class="card"><h2>商品名・型番から検索</h2><label>カテゴリー</label><select id="searchCat" onchange="updateFeeNote()"><option>ポケモンカード</option><option>ポケモン関連サプライ用品</option><option>釣具</option><option>カメラ</option><option>レトロゲーム</option></select><label>商品名・型番</label><input id="searchName" placeholder="例：Pokemon 151 Charizard"><label>仕入れ価格（円）</label><input id="searchCost" type="number" value="8000"><label>目標利益（円）</label><input id="targetProfit" type="number" value="3000"><label>1ドル＝何円で計算？</label><input id="usdJpy" type="number" value="150"><div id="feeNote" class="muted">eBay US・ストアなし想定：落札手数料13.25%＋海外手数料1.35%＋注文固定$0.40</div><button class="primary" onclick="searchProduct()">eBayを検索して利益を計算</button><div id="searchResult" class="result"></div></div></section>
<section id="photo" class="panel"><div class="card"><h2>写真から商品を探す</h2><div class="notice">写真をアップロードすると候補表示の準備ができます。</div><input type="file" accept="image/*" onchange="previewPhoto(event)"><img id="preview" style="max-width:100%;max-height:220px;display:none;margin-top:8px;border-radius:12px"><div id="photoCandidate" class="result"></div></div></section><div id="detail"></div>
</main><script>
const API_URL=window.EBAY_API_URL||'/api/ebay-search';let products=[];
const FEE={"ポケモンカード":.1325,"ポケモン関連サプライ用品":.136,"釣具":.136,"カメラ":.136,"レトロゲーム":.136};
const INTERNATIONAL=.0135,ORDER_FEE_USD=.40;
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');}
function feeRate(cat){return FEE[cat]??.136}
function calc(p,cost,cat){const fx=Number(document.getElementById('usdJpy')?.value||150);const saleUsd=Number(p.sell||0);const shipUsd=Number(p.ship||0);const totalUsd=saleUsd+shipUsd;const finalValue=totalUsd*feeRate(cat);const international=totalUsd*INTERNATIONAL;const fixed=ORDER_FEE_USD*fx;const revenueJpy=saleUsd*fx;const shipJpy=shipUsd*fx;const feeJpy=(finalValue+international)*fx+fixed;return {revenueJpy,shipJpy,feeJpy,profit:Math.round(revenueJpy-shipJpy-feeJpy-Number(cost||0)),rate:feeRate(cat),international:international*fx,fixed}}
function normalize(x,cat,cost){return {name:x.name||x.title||'商品',cat, cost, sell:Number(x.sell||x.price||0),ship:Number(x.ship||x.shipping||0),image:x.image||x.imageUrl||'',url:x.url||'',condition:x.condition||'',sold:Number(x.sold||0),list:Number(x.list||0),trend:x.trend||'不明',risk:x.risk||'要確認'}}
function updateFeeNote(){const c=document.getElementById('searchCat').value;document.getElementById('feeNote').textContent=`eBay US・ストアなし想定：落札手数料${(feeRate(c)*100).toFixed(2)}%＋海外手数料1.35%＋注文固定$0.40`}
function score(p){const x=calc(p,p.cost,p.cat);const demand=p.sold/Math.max(p.list,1);return x.profit/1000+Math.min(demand,4)*1.5+(p.trend==='上昇'?2:0)+(p.risk==='低'?1:.5)}
function rank(list){return list.map(p=>({...p,profit:calc(p,p.cost,p.cat).profit})).sort((a,b)=>score(b)-score(a))}
function renderCats(){const cats=[...new Set(products.map(p=>p.cat).filter(Boolean))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat" onclick="renderRank(${JSON.stringify(c)})"><b>${c}</b><small>${products.filter(p=>p.cat===c).length}件</small></button>`).join('')}
function card(p,i){return `<div class="card"><span class="muted">#${i+1}</span> <span class="badge">${i<3?'注目候補':'おすすめ候補'}</span><h3>${p.name}</h3><div class="row"><span>予想利益</span><b class="${p.profit>=0?'green':'red'}">${p.profit>=0?'+':''}${p.profit.toLocaleString()}円</b></div><div class="row"><span>販売価格</span><b>${Math.round(p.sell*Number(document.getElementById('usdJpy')?.value||150)).toLocaleString()}円</b></div><div class="row"><span>eBay手数料</span><b>${calc(p,p.cost,p.cat).feeJpy.toLocaleString()}円</b></div><div class="row"><span>リスク</span><b>${p.risk||'要確認'}</b></div></div>`}
function renderOverall(){document.getElementById('ranking').innerHTML=`<div class="card"><h2>全カテゴリー｜おすすめTOP10</h2>${rank(products).slice(0,10).map(card).join('')}</div>`}
function renderRank(cat){document.getElementById('ranking').innerHTML=`<div class="card"><h2>${cat}｜おすすめ</h2>${rank(products.filter(p=>p.cat===cat)).map(card).join('')}</div>`}
async function refreshRanking(){const st=document.getElementById('rankingStatus');st.textContent='eBayデータを確認中…';try{const r=await fetch(API_URL+'?q=Pokemon%20151%20Charizard');if(!r.ok)throw 0;const d=await r.json();if(d.items?.length){products=d.items.map(x=>normalize(x,'ポケモンカード',8000));st.textContent='eBayライブデータを取得しました';renderCats();renderOverall();return}}catch(e){}if(!products.length)products=sampleProducts();st.textContent='サンプルデータを表示中（eBay接続後はライブ化）';renderCats();renderOverall()}
async function searchProduct(){const q=document.getElementById('searchName').value.trim();const cat=document.getElementById('searchCat').value;const cost=Number(document.getElementById('searchCost').value||0);const target=Number(document.getElementById('targetProfit').value||0);const box=document.getElementById('searchResult');if(!q){box.innerHTML='<div class="notice">商品名・型番を入力してください。</div>';return}box.innerHTML='<div class="notice">eBayを検索しています…</div>';try{const r=await fetch(API_URL+'?q='+encodeURIComponent(q));if(!r.ok)throw 0;const d=await r.json();const items=(d.items||[]).map(x=>normalize(x,cat,cost));if(items.length){box.innerHTML='<div class="notice">eBay検索結果 '+items.length+'件。価格はUSDを円換算しています。</div><div class="search-product-grid">'+items.slice(0,10).map(p=>{const x=calc(p,cost,cat);const max=Math.max(0,Math.floor((p.sell+p.ship)*Number(document.getElementById('usdJpy').value||150)-x.feeJpy-target-p.ship*Number(document.getElementById('usdJpy').value||150)));return `<div class="search-product-card"><h3>${p.name}</h3><div class="row"><span>販売価格</span><b>${Math.round(x.revenueJpy).toLocaleString()}円</b></div><div class="row"><span>送料</span><b>${Math.round(x.shipJpy).toLocaleString()}円</b></div><div class="row"><span>eBay手数料</span><b>${x.feeJpy.toLocaleString()}円</b></div><div class="row"><span>予想利益</span><b class="${x.profit>=0?'green':'red'}">${x.profit.toLocaleString()}円</b></div><div class="row"><span>目標利益を残せる仕入れ上限</span><b>${max.toLocaleString()}円</b></div>${p.url?`<a href="${p.url}" target="_blank" rel="noopener">eBayの商品を見る ›</a>`:''}</div>`}).join('')+'</div>';return}}catch(e){}box.innerHTML='<div class="notice">eBayから結果を取得できませんでした。APIの設定を確認してください。</div>'}
function previewPhoto(e){const f=e.target.files?.[0];if(!f)return;const img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block';document.getElementById('photoCandidate').innerHTML='<div class="notice">写真を受け取りました。商品候補の自動判定は次の段階で追加できます。</div>'}
function sampleProducts(){return[{name:'Pokemon Card 151 Booster Box',cat:'ポケモンカード',cost:8000,sell:100,ship:12,sold:84,list:29,trend:'安定',risk:'低'},{name:'Pokemon Charizard ex SAR',cat:'ポケモンカード',cost:9800,sell:117,ship:6,sold:72,list:35,trend:'上昇',risk:'低'},{name:'Popular Camera Lens',cat:'カメラ',cost:22000,sell:273,ship:30,sold:34,list:24,trend:'上昇',risk:'低'},{name:'Game Boy Popular Game',cat:'レトロゲーム',cost:3500,sell:50,ship:12,sold:57,list:20,trend:'上昇',risk:'低'}]}
products=sampleProducts();renderCats();renderOverall();
</script></body></html>
