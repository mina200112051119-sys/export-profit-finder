<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>輸出せどり利益計算ツール</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f6f8;color:#1f2937}header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:20px}header p{margin:5px 0 0;color:#cbd5e1;font-size:12px}main{max-width:960px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.tab,button{border:0;border-radius:12px;padding:12px;background:#fff;box-shadow:0 1px 4px #0001;font-weight:700;cursor:pointer}.tab.active{background:#111827;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{text-align:left}.cat small{display:block;color:#64748b;margin-top:4px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 10px}.primary{background:#2563eb;color:#fff;width:100%}.secondary{background:#e5e7eb;width:100%;margin-top:8px}.muted{color:#64748b;font-size:12px}.status,.notice{background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px}.notice{background:#eff6ff}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}.green{color:#15803d}.red{color:#b91c1c}.yellow{color:#a16207}.stars{letter-spacing:1px}.score{font-size:22px;font-weight:900}.product{cursor:pointer}.product:focus{outline:3px solid #93c5fd}.search-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.search-card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;cursor:pointer}.search-card img{width:100%;height:130px;object-fit:contain;background:#f8fafc;border-radius:10px}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.photo-card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;background:#fff}.photo-card img{width:100%;height:160px;object-fit:contain;background:#f8fafc;border-radius:10px}.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal-backdrop.open{display:flex}.modal{background:#fff;width:min(920px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;padding-bottom:10px;z-index:2}.close{background:#e5e7eb;padding:9px 14px}.detail-image{width:100%;max-height:260px;object-fit:contain;background:#f8fafc;border-radius:12px}.risk-table{width:100%;border-collapse:collapse;font-size:13px}.risk-table th,.risk-table td{padding:9px 6px;border-bottom:1px solid #e5e7eb;text-align:left}.low{color:#15803d;font-weight:800}.mid{color:#a16207;font-weight:800}.high{color:#b91c1c;font-weight:800}@media(max-width:600px){.grid,.search-grid,.photo-grid{grid-template-columns:1fr}.modal{max-height:95vh}}</style></head><body><header><h1>輸出せどり利益計算ツール</h1><p>利益・売れやすさ・相場・売れ残りリスクを総合判定</p></header><main><div class="tabs"><button class="tab active" onclick="tab('recommend',this)">おすすめ</button><button class="tab" onclick="tab('search',this)">商品を検索</button><button class="tab" onclick="tab('photo',this)">写真から探す</button></div><section id="recommend" class="panel active"><div class="card"><h2>データ更新状況</h2><div id="status" class="status">読み込み中…</div><button id="refresh" class="primary" onclick="refresh()">🔄 今すぐ更新・再計算</button><p class="muted">ランキング計算はRankingEngineに一本化。販売実績は取得できた場合のみ実データを使用します。</p></div><div class="card"><h2>カテゴリー別ランキング</h2><div id="cats" class="grid"></div></div><div class="card"><div id="ranking"></div></div></section><section id="search" class="panel"><div class="card"><h2>商品名・型番から検索</h2><label>カテゴリー</label><select id="cat"><option>ポケモンカード</option><option>ポケモン関連サプライ用品</option><option>釣具</option><option>カメラ</option><option>レトロゲーム</option></select><label>商品名・型番</label><input id="q" placeholder="例：Pokemon 151 Charizard"><label>仕入価格（円）</label><input id="cost" type="number" value="8000"><div id="fx" class="status">為替取得中…</div><button class="primary" onclick="search()">eBayで検索</button><div id="results" class="search-grid"></div></div></section><section id="photo" class="panel"><div class="card"><h2>写真から探す</h2><div class="notice">写真をeBayの画像検索に送り、似ている出品候補を表示します。写真だけで商品を確定するものではありません。</div><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="photo(event)"><img id="preview" style="display:none;max-width:100%;max-height:220px;border-radius:12px;margin-top:8px"><button id="photoSearch" class="primary" style="display:none;margin-top:10px" onclick="searchByPhoto()">写真からeBay候補を探す</button><div id="photoMsg" class="status" style="display:none"></div><div id="photoResults" class="photo-grid"></div></div></section><section class="card"><h2>利益計算の設定</h2><div class="grid"><div><label>国内送料</label><input id="domestic" type="number" value="0"></div><div><label>梱包費</label><input id="pack" type="number" value="0"></div><div><label>その他経費</label><input id="other" type="number" value="0"></div><div><label>為替換算手数料%</label><input id="conv" type="number" value="0" step="0.01"></div></div><button class="secondary" onclick="save();render()">保存して再計算</button></section></main><div id="modal" class="modal-backdrop" onclick="closeDetail(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2 id="title">商品詳細</h2><button class="close" onclick="closeDetail()">× 閉じる</button></div><div id="body"></div></div></div><script src="/ranking-engine.js"></script><script>'use strict';
const API='/api/ebay-search',SOLD='/api/ebay-sold-search',FX='/api/exchange-rate',IMAGE_API='/api/ebay-search-by-image';
const FEES={'ポケモンカード':.1325,'ポケモン関連サプライ用品':.136,'釣具':.136,'カメラ':.136,'レトロゲーム':.136};
const INT=.0135;
const SOLD_CATEGORY={'ポケモンカード':'183454','ポケモン関連サプライ用品':'183460','釣具':'261030','カメラ':'31388','レトロゲーム':'139973'};
let data=[],fxRate=150,fxDate='',updated='',soldAccess=false,photoDataUrl='';
const $=x=>document.getElementById(x);
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');b.classList.add('active')}
function yen(v){return v==null?'—':Math.round(Number(v||0)).toLocaleString()+'円'}
function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function baseSettings(){return{fxRate,feeRateByCategory:FEES,internationalRate:INT,orderFeeUsd:.4,domesticShipping:+$('domestic').value||0,packaging:+$('pack').value||0,otherCost:+$('other').value||0,conversionFeeRate:+$('conv').value||0}}
function settings(p){return{...baseSettings(),feeRate:FEES[p.cat]||.136}}
function save(){['domestic','pack','other','conv'].forEach(id=>localStorage.setItem(id,$(id).value))}
function load(){['domestic','pack','other','conv'].forEach(id=>{const v=localStorage.getItem(id);if(v!==null)$(id).value=v})}
function samples(){return[{name:'ポケモンカード 人気カード（サンプル）',cat:'ポケモンカード',cost:8000,sell:95,ship:18,sold:72,list:28,trend:'横ばい',risk:'低',source:'サンプル'},{name:'ポケモンTCG デッキケース（サンプル）',cat:'ポケモン関連サプライ用品',cost:2500,sell:39,ship:14,sold:46,list:34,trend:'上昇',risk:'低',source:'サンプル'},{name:'日本製フィッシングリール（サンプル）',cat:'釣具',cost:18000,sell:165,ship:35,sold:31,list:29,trend:'横ばい',risk:'中',source:'サンプル'},{name:'日本製中古カメラ（サンプル）',cat:'カメラ',cost:30000,sell:285,ship:42,sold:18,list:42,trend:'下落',risk:'中',source:'サンプル'},{name:'レトロゲーム本体（サンプル）',cat:'レトロゲーム',cost:9000,sell:105,ship:30,sold:39,list:21,trend:'横ばい',risk:'低',source:'サンプル'}].map(RankingEngine.normalizeProduct)}
async function fx(){try{const r=await fetch(FX,{cache:'no-store'}),d=await r.json();if(d.rate){fxRate=+d.rate;fxDate=d.date||''}}catch(e){}}
async function ebay(q){const r=await fetch(API+'?q='+encodeURIComponent(q),{cache:'no-store'});if(!r.ok)throw Error('eBay検索失敗 '+r.status);return r.json()}
async function sold(q,cat){try{const r=await fetch(SOLD+'?q='+encodeURIComponent(q)+'&categoryId='+encodeURIComponent(SOLD_CATEGORY[cat]),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Object.assign(new Error('sold unavailable'),{accessRequired:d.accessRequired});return d}catch(e){soldAccess=false;return null}}
function map(d,cat,cost=0){return(d.items||[]).map(x=>RankingEngine.normalizeProduct({id:x.itemId,name:x.title,cat,cost,sell:x.price,ship:x.shipping,image:x.image,url:x.url,condition:x.condition,source:'eBay現在出品'}))}
async function enrichSold(items){if(!items.length)return items;const out=await Promise.all(items.slice(0,10).map(async p=>{const d=await sold(p.name,p.cat);if(!d)return p;soldAccess=true;return RankingEngine.normalizeProduct({...p,soldHistoryAvailable:true,soldHistoryCount:d.count||0,soldMedian:d.medianSoldPrice||0,historicalPrices:(d.items||[]).map(x=>x.price).filter(Boolean),source:'eBay現在出品＋過去90日販売データ'});}));return out.concat(items.slice(10))}
function rank(cat=null){return RankingEngine.rank(data,baseSettings(),cat)}
function renderList(list,title){$('ranking').innerHTML='<h2>'+esc(title)+'</h2><p class="muted">100点：売れやすさ30・利益率25・利益額15・価格安定性10・在庫リスク10・手数料/経費5・相場5。過去90日販売データが取得できた商品だけ実販売データを使用します。</p>'+list.slice(0,10).map((p,i)=>{const c=p.costs;return '<div class="card product" tabindex="0" onclick="detail(\''+encodeURIComponent(p.id)+'\')" onkeydown="if(event.key===\'Enter\'){detail(\''+encodeURIComponent(p.id)+'\')}"><div style="display:flex;justify-content:space-between"><b>#'+(i+1)+'</b><span class="stars">'+p.stars+'</span></div><h3>'+esc(p.name)+'</h3><div class="row"><span>総合点</span><b class="score">'+p.totalScore+'点</b></div><div class="row"><span>予想利益</span><b class="'+(c.profit==null?'yellow':c.profit>=0?'green':'red')+'">'+(c.profit==null?'仕入価格未入力':(c.profit>=0?'+':'')+yen(c.profit))+'</b></div><div class="row"><span>過去90日販売</span><b>'+(p.soldHistoryAvailable?p.soldHistoryCount+'件':'データなし')+'</b></div><div class="row"><span>リスク</span><b class="'+riskClass(p.risk)+'">'+p.risk+'</b></div></div>'}).join('')||'<div class="notice">表示できる商品がありません。</div>'}
function riskClass(r){return r==='低'?'low':r==='中'?'mid':r==='高'?'high':'yellow'}
function renderCats(){$('cats').innerHTML=RankingEngine.CATEGORIES.map(c=>'<button class="cat" onclick="category(\''+c.replaceAll("'","\\'")+'\')"><b>'+c+'</b><small>'+data.filter(p=>p.cat===c).length+'件｜TOP10を見る</small></button>').join('')}
function render(){renderCats();renderList(rank(),'全カテゴリー｜おすすめTOP10');$('fx').textContent='USD/JPY：'+fxRate.toFixed(2)+'｜更新日：'+(fxDate||'不明')}
function category(c){renderList(rank(c),c+'｜おすすめTOP10')}
async function refresh(){const b=$('refresh');b.disabled=true;$('status').textContent='eBay・過去90日販売・為替を更新中…';try{await fx();let live=[];for(const c of RankingEngine.CATEGORIES){try{const q=c==='ポケモンカード'?'Pokemon card Japan':c==='ポケモン関連サプライ用品'?'Pokemon TCG supplies Japan':c==='釣具'?'Japanese fishing tackle':c==='カメラ'?'Japanese camera':'Japanese retro game';const d=await ebay(q);let a=map(d,c);a=await enrichSold(a);live.push(...a)}catch(e){}}data=live.length?live:samples();updated=new Date().toLocaleString('ja-JP');render();$('status').innerHTML='<b>更新完了</b><br>更新日時：'+esc(updated)+(soldAccess?'<br>過去90日販売データ：取得あり':'<br>過去90日販売データ：取得できない商品があります');}catch(e){data=samples();render();$('status').textContent='更新失敗。サンプルデータを表示しています。'}finally{b.disabled=false}}
async function search(){const q=$('q').value.trim(),cat=$('cat').value,cost=+$('cost').value||0;if(!q)return;$('results').innerHTML='<div class="notice">eBay検索中…</div>';try{const d=await ebay(q),items=map(d,cat,cost);const enriched=await enrichSold(items);$('results').innerHTML=enriched.slice(0,12).map((p,i)=>'<div class="search-card" onclick="detail(\''+encodeURIComponent(p.id)+'\')">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'')+'<b>'+esc(p.name)+'</b><div>'+yen(p.sell)+' +送料 '+yen(p.ship)+'</div><small>'+esc(p.condition||'状態不明')+'｜'+(p.soldHistoryAvailable?'過去90日販売 '+p.soldHistoryCount+'件':'販売実績データなし')+'</small></div>').join('')||'<div class="notice">候補がありません。</div>'}catch(e){$('results').innerHTML='<div class="notice">検索できませんでした。eBay設定を確認してください。</div>'}}
function photo(e){const file=e.target.files?.[0];if(!file)return;const ok=['image/jpeg','image/png','image/webp'];if(!ok.includes(file.type)){photoDataUrl='';$('photoMsg').style.display='block';$('photoMsg').textContent='JPEG・PNG・WebPを選択してください。';$('photoSearch').style.display='none';return}const reader=new FileReader();reader.onload=()=>{photoDataUrl=String(reader.result||'');$('preview').src=photoDataUrl;$('preview').style.display='block';$('photoSearch').style.display='block';$('photoMsg').style.display='block';$('photoMsg').textContent='写真を確認しました。「写真からeBay候補を探す」を押してください。'};reader.readAsDataURL(file)}
async function searchByPhoto(){if(!photoDataUrl)return;$('photoSearch').disabled=true;$('photoResults').innerHTML='';$('photoMsg').style.display='block';$('photoMsg').textContent='eBay画像検索中…';try{const r=await fetch(IMAGE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:photoDataUrl})});const d=await r.json();if(!r.ok)throw new Error(d.error||'画像検索に失敗しました');if(!d.items?.length){$('photoMsg').textContent='候補が見つかりませんでした。別の角度・明るい写真でも試してください。';return}window.photoCandidates=d.items;$('photoMsg').textContent='候補が見つかりました。近い商品を1つ選んでください。';$('photoResults').innerHTML=d.items.map((x,i)=>'<div class="photo-card" onclick="selectPhotoCandidate('+i+')">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+'<h3>'+esc(x.title)+'</h3><div><b>'+yen(x.price)+' '+esc(x.currency)+'</b></div><div>送料 '+yen(x.shipping)+' '+esc(x.currency)+'</div><small>'+esc(x.condition||'状態不明')+'</small><button class="primary" style="margin-top:8px">この候補を選ぶ</button></div>').join('')}catch(e){$('photoMsg').textContent='画像検索に失敗しました。eBay API設定または画像形式を確認してください。'}finally{$('photoSearch').disabled=false}}
function selectPhotoCandidate(i){const x=window.photoCandidates?.[i];if(!x)return;const cat=$('cat');const title=x.title||'';const guessed=title.toLowerCase().includes('pokemon')?'ポケモンカード':title.toLowerCase().includes('camera')?'カメラ':title.toLowerCase().includes('fishing')?'釣具':title.toLowerCase().includes('game')?'レトロゲーム':'ポケモン関連サプライ用品';cat.value=guessed;$('q').value=title;$('cost').value='';tab('search',document.querySelectorAll('.tab')[1]);$('results').innerHTML='<div class="notice">写真から選択した候補です。仕入価格を入力して、利益計算へ進んでください。</div><div class="search-card">'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+'<b>'+esc(title)+'</b><div>eBay現在価格：'+yen(x.price)+' '+esc(x.currency)+'</div><div>送料：'+yen(x.shipping)+' '+esc(x.currency)+'</div><a href="'+esc(x.url)+'" target="_blank" rel="noopener">eBayの商品ページを見る</a></div>'}
function detail(id){const p=data.find(x=>encodeURIComponent(x.id)===id);if(!p)return;const s=settings(p),r=RankingEngine.scoreProduct(p,s,data),c=r.costs;$('title').textContent=p.name;$('body').innerHTML=(p.image?'<img class="detail-image" src="'+esc(p.image)+'" alt="">':'')+'<div class="row"><span>総合評価</span><b>'+r.stars+' '+r.totalScore+'点</b></div><div class="row"><span>利益</span><b class="'+(c.profit>=0?'green':'red')+'">'+(c.profit==null?'仕入価格未入力':yen(c.profit))+'</b></div><div class="row"><span>損益分岐点</span><b>'+yen(r.riskData.breakEven)+'</b></div><h3>30/60/90日後シナリオ</h3><table class="risk-table"><tr><th>期間</th><th>想定売価</th><th>利益</th><th>リスク</th></tr>'+r.riskData.scenarios.map(x=>'<tr><td>'+x.days+'日</td><td>'+yen(x.sale)+'</td><td>'+yen(x.profit)+'</td><td class="'+riskClass(x.risk)+'">'+x.risk+'</td></tr>').join('')+'</table><h3>経費</h3><div class="row"><span>eBay手数料</span><b>'+yen(c.finalValueFeeJpy)+'</b></div><div class="row"><span>国際手数料</span><b>'+yen(c.internationalFeeJpy)+'</b></div><div class="row"><span>固定手数料</span><b>'+yen(c.fixedFeeJpy)+'</b></div><div class="row"><span>為替換算手数料</span><b>'+yen(c.conversionFeeJpy)+'</b></div><div class="row"><span>その他経費</span><b>'+yen(c.localCosts)+'</b></div><h3>データ信頼度</h3><div class="notice">'+esc(r.confidence)+'｜'+esc(r.sellabilityBasis)+'</div><p class="muted">'+esc(r.flags.join('／'))+'</p>'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">eBay出品を見る</a>':'');$('modal').classList.add('open')}
function closeDetail(e){if(!e||e.target===$('modal'))$('modal').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});
load();data=samples();render();fx();</script></body></html>
