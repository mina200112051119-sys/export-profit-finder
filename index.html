<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>輸出せどり利益計算ツール</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f6f8;color:#1f2937}header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:20px}header p{margin:5px 0 0;color:#cbd5e1;font-size:12px}main{max-width:920px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.tab,button{border:0;border-radius:12px;padding:12px;background:white;box-shadow:0 1px 4px #0001;font-weight:700;cursor:pointer}.tab.active{background:#111827;color:white}.panel{display:none}.panel.active{display:block}.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{text-align:left}.cat small{display:block;color:#64748b;margin-top:4px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 10px}.primary{background:#2563eb;color:white;width:100%}.secondary{background:#e5e7eb;width:100%;margin-top:8px}.muted{color:#64748b;font-size:12px}.status{background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}.green{color:#15803d}.red{color:#b91c1c}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.stars{letter-spacing:1px}.score{font-size:22px;font-weight:900}.product{cursor:pointer}.product:focus{outline:3px solid #93c5fd}.search-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.search-card{border:1px solid #e5e7eb;border-radius:14px;padding:12px;cursor:pointer}.search-card img{width:100%;height:130px;object-fit:contain;background:#f8fafc;border-radius:10px}.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal-backdrop.open{display:flex}.modal{background:white;width:min(920px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;padding-bottom:10px;z-index:2}.close{background:#e5e7eb;padding:9px 14px}.detail-image{width:100%;max-height:260px;object-fit:contain;background:#f8fafc;border-radius:12px}.risk-table{width:100%;border-collapse:collapse;font-size:13px}.risk-table th,.risk-table td{padding:9px 6px;border-bottom:1px solid #e5e7eb;text-align:left}.low{color:#15803d;font-weight:800}.mid{color:#a16207;font-weight:800}.high{color:#b91c1c;font-weight:800}.notice{background:#eff6ff;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}@media(max-width:600px){.grid,.search-grid{grid-template-columns:1fr}.modal{max-height:95vh}}
</style></head><body><header><h1>輸出せどり利益計算ツール</h1><p>利益・売れやすさ・相場・売れ残りリスクを総合判定</p></header><main>
<div class="tabs"><button class="tab active" onclick="tab('recommend',this)">おすすめ</button><button class="tab" onclick="tab('search',this)">商品を検索</button><button class="tab" onclick="tab('photo',this)">写真から探す</button></div>
<section id="recommend" class="panel active"><div class="card"><h2>データ更新状況</h2><div id="status" class="status">読み込み中…</div><button id="refresh" class="primary" onclick="refresh()">🔄 今すぐ更新・再計算</button><p class="muted">ランキング計算はRankingEngineに一本化しています。</p></div><div class="card"><h2>カテゴリー別ランキング</h2><div id="cats" class="grid"></div></div><div class="card"><div id="ranking"></div></div></section>
<section id="search" class="panel"><div class="card"><h2>商品名・型番から検索</h2><label>カテゴリー</label><select id="cat"><option>ポケモンカード</option><option>ポケモン関連サプライ用品</option><option>釣具</option><option>カメラ</option><option>レトロゲーム</option></select><label>商品名・型番</label><input id="q" placeholder="例：Pokemon 151 Charizard"><label>仕入価格（円）</label><input id="cost" type="number" value="8000"><div id="fx" class="status">為替取得中…</div><button class="primary" onclick="search()">eBayで検索</button><div id="results" class="search-grid"></div></div></section>
<section id="photo" class="panel"><div class="card"><h2>写真から探す</h2><div class="notice">写真表示まで対応。自動商品認識は次段階で追加します。</div><input type="file" accept="image/*" onchange="photo(event)"><img id="preview" style="display:none;max-width:100%;max-height:220px;border-radius:12px;margin-top:8px"><div id="photoMsg" class="status" style="display:none"></div></div></section>
<section class="card"><h2>利益計算の設定</h2><div class="grid"><div><label>国内送料</label><input id="domestic" type="number" value="0"></div><div><label>梱包費</label><input id="pack" type="number" value="0"></div><div><label>その他経費</label><input id="other" type="number" value="0"></div><div><label>為替換算手数料%</label><input id="conv" type="number" value="0" step="0.01"></div></div><button class="secondary" onclick="save();render()">保存して再計算</button></section>
</main><div id="modal" class="modal-backdrop" onclick="closeDetail(event)"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2 id="title">商品詳細</h2><button class="close" onclick="closeDetail()">× 閉じる</button></div><div id="body"></div></div></div>
<script src="/ranking-engine.js"></script><script>
'use strict';const API='/api/ebay-search',FX='/api/exchange-rate';const FEES={'ポケモンカード':.1325,'ポケモン関連サプライ用品':.136,'釣具':.136,'カメラ':.136,'レトロゲーム':.136};const INT=.0135;let data=[],fxRate=150,fxDate='',updated='';const $=x=>document.getElementById(x);function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');b.classList.add('active')}function yen(v){return Math.round(Number(v||0)).toLocaleString()+'円'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function settings(p){return{fxRate,feeRate:FEES[p.cat]||.136,internationalRate:INT,orderFeeUsd:.4,domesticShipping:+$('domestic').value||0,packaging:+$('pack').value||0,otherCost:+$('other').value||0,conversionFeeRate:+$('conv').value||0}}function save(){['domestic','pack','other','conv'].forEach(id=>localStorage.setItem(id,$(id).value))}function load(){['domestic','pack','other','conv'].forEach(id=>{const v=localStorage.getItem(id);if(v!==null)$(id).value=v})}function samples(){return[{'name':'ポケモンカード 人気カード（サンプル）','cat':'ポケモンカード',cost:8000,sell:95,ship:18,sold:72,list:28,trend:'横ばい',risk:'低',source:'サンプル'},{name:'ポケモンTCG デッキケース（サンプル）',cat:'ポケモン関連サプライ用品',cost:2500,sell:39,ship:14,sold:46,list:34,trend:'上昇',risk:'低',source:'サンプル'},{name:'日本製フィッシングリール（サンプル）',cat:'釣具',cost:18000,sell:165,ship:35,sold:31,list:29,trend:'横ばい',risk:'中',source:'サンプル'},{name:'日本製中古カメラ（サンプル）',cat:'カメラ',cost:30000,sell:285,ship:42,sold:18,list:42,trend:'下落',risk:'中',source:'サンプル'},{name:'レトロゲーム本体（サンプル）',cat:'レトロゲーム',cost:9000,sell:105,ship:30,sold:39,list:21,trend:'横ばい',risk:'低',source:'サンプル'}].map(RankingEngine.normalizeProduct)}async function fx(){try{const r=await fetch(FX,{cache:'no-store'}),d=await r.json();if(d.rate){fxRate=+d.rate;fxDate=d.date||''}}catch(e){}}async function ebay(q){const r=await fetch(API+'?q='+encodeURIComponent(q),{cache:'no-store'});if(!r.ok)throw Error('eBay検索失敗 '+r.status);return r.json()}function map(d,cat,cost=0){return(d.items||[]).map(x=>RankingEngine.normalizeProduct({id:x.itemId,name:x.title,cat,cost,sell:x.price,ship:x.shipping,image:x.image,url:x.url,condition:x.condition,source:'eBay現在出品'}))}function rank(cat=null){return RankingEngine.rank(data,{},cat)}function renderList(list,title){$('ranking').innerHTML='<h2>'+esc(title)+'</h2><p class="muted">100点：売れやすさ30・利益率25・利益額15・価格安定性10・在庫リスク10・手数料/経費5・相場5。データ不足は信頼度を下げます。</p>'+list.slice(0,10).map((p,i)=>{const c=p.costs;return '<div class="card product" tabindex="0" onclick="detail(\''+encodeURIComponent(p.id)+'\')" onkeydown="if(event.key===\'Enter\'){detail(\''+encodeURIComponent(p.id)+'\')}"><div style="display:flex;justify-content:space-between"><b>#'+(i+1)+'</b><span class="stars">'+p.stars+'</span></div><h3>'+esc(p.name)+'</h3><div class="row"><span>総合点</span><b class="score">'+p.totalScore+'点</b></div><div class="row"><span>予想利益</span><b class="'+(c.profit>=0?'green':'red')+'">'+(c.profit>=0?'+':'')+yen(c.profit)+'</b></div><div class="row"><span>売れやすさ</span><b>'+p.scores.sellability.toFixed(0)+'点</b></div><div class="row"><span>リスク</span><b class="'+riskClass(p.risk)+'">'+p.risk+'</b></div></div>'}).join('')||'<div class="notice">表示できる商品がありません。</div>'}function riskClass(r){return r==='低'?'low':r==='中'?'mid':'high'}function renderCats(){$('cats').innerHTML=RankingEngine.CATEGORIES.map(c=>'<button class="cat" onclick="category(\''+c.replaceAll("'","\\'")+'\')"><b>'+c+'</b><small>'+data.filter(p=>p.cat===c).length+'件｜TOP10を見る</small></button>').join('')}function render(){renderCats();renderList(rank(),'全カテゴリー｜おすすめTOP10');$('fx').textContent='USD/JPY：'+fxRate.toFixed(2)+'｜更新日：'+(fxDate||'不明')}function category(c){renderList(rank(c),c+'｜おすすめTOP10')}async function refresh(){const b=$('refresh');b.disabled=true;$('status').textContent='eBayと為替を更新中…';try{await fx();let live=[];for(const c of RankingEngine.CATEGORIES){try{const d=await ebay(c==='ポケモンカード'?'Pokemon card Japan':c==='ポケモン関連サプライ用品'?'Pokemon TCG supplies Japan':c==='釣具'?'Japanese fishing tackle':c==='カメラ'?'Japanese camera':'Japanese retro game');live.push(...map(d,c))}catch(e){}}data=live.length?live:samples();updated=new Date().toLocaleString('ja-JP');render();$('status').innerHTML='<b>最終更新：</b>'+esc(updated)+'<br><b>データ：</b>'+(live.length?'eBay現在出品データ':'サンプルデータ（eBay取得失敗）')+'<br><b>為替：</b>'+fxRate.toFixed(2)+' USD/JPY'}catch(e){data=samples();updated=new Date().toLocaleString('ja-JP');render();$('status').textContent='更新失敗。サンプルデータを表示しています。'}finally{b.disabled=false}}async function search(){const q=$('q').value.trim(),cat=$('cat').value,cost=+$('cost').value||0;if(!q){$('results').innerHTML='<div class="notice">商品名・型番を入力してください。</div>';return}$('results').innerHTML='<div class="notice">検索中…</div>';try{const d=await ebay(q),found=map(d,cat,cost);data=[...found,...data.filter(p=>!found.some(x=>x.id===p.id))];const r=RankingEngine.rank(found,settings(found[0]||{cat}));$('results').innerHTML=r.slice(0,10).map(p=>'<div class="search-card" onclick="detail(\''+encodeURIComponent(p.id)+'\')">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'')+'<h3>'+esc(p.name)+'</h3><div class="row"><span>販売価格</span><b>$'+p.sell.toFixed(2)+'</b></div><div class="row"><span>予想利益</span><b class="'+(p.costs.profit>=0?'green':'red')+'">'+yen(p.costs.profit)+'</b></div><div class="stars">'+p.stars+'</div></div>').join('')||'<div class="notice">候補がありません。</div>'}catch(e){$('results').innerHTML='<div class="notice">検索できませんでした。</div>'}}function photo(e){const f=e.target.files&&e.target.files[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').style.display='block';$('photoMsg').style.display='block';$('photoMsg').innerHTML='<b>写真を受け取りました。</b><br>自動商品認識は次段階で実装します。写真だけで商品を断定しません。'}function detail(encoded){const raw=data.find(p=>p.id===decodeURIComponent(encoded));if(!raw)return;const p=RankingEngine.scoreProduct(raw,settings(raw),data),c=p.costs,r=p.riskData;$('title').textContent=p.name;$('body').innerHTML=(p.image?'<img class="detail-image" src="'+esc(p.image)+'" alt="">':'')+'<div style="display:flex;justify-content:space-between;gap:10px"><span class="stars">'+p.stars+'</span><b class="'+riskClass(p.risk)+'">リスク：'+p.risk+'</b></div><div class="score '+(c.profit>=0?'green':'red')+'">'+(c.profit>=0?'+':'')+yen(c.profit)+'</div><div class="row"><span>総合評価</span><b>'+p.totalScore+'点</b></div><div class="row"><span>利益率</span><b>'+(c.margin===null?'データ不足':(c.margin*100).toFixed(1)+'%')+'</b></div><div class="row"><span>売れやすさ</span><b>'+p.scores.sellability.toFixed(0)+'点</b></div><div class="row"><span>データ信頼度</span><b>'+p.confidence+'</b></div><h3>経費内訳</h3><div class="row"><span>販売価格</span><b>'+yen(c.saleJpy)+'</b></div><div class="row"><span>仕入価格</span><b>'+yen(p.cost)+'</b></div><div class="row"><span>eBay販売手数料</span><b>'+yen(c.finalValueFeeJpy)+'</b></div><div class="row"><span>International Fee</span><b>'+yen(c.internationalFeeJpy)+'</b></div><div class="row"><span>注文固定費</span><b>'+yen(c.fixedFeeJpy)+'</b></div><div class="row"><span>送料</span><b>'+yen(c.shipJpy)+'</b></div><div class="row"><span>国内・梱包・その他</span><b>'+yen(c.localCosts)+'</b></div><h3>損益分岐点</h3><div class="notice">最低販売価格の目安：<b>'+yen(r.breakEven)+'</b></div><h3>売れ残りリスク</h3><table class="risk-table"><tr><th>時期</th><th>想定売価</th><th>予想利益</th><th>利益率</th><th>リスク</th></tr>'+r.scenarios.map(s=>'<tr><td>'+s.days+'日後</td><td>'+yen(s.sale)+'</td><td class="'+(s.profit>=0?'green':'red')+'">'+(s.profit>=0?'+':'')+yen(s.profit)+'</td><td>'+(s.margin===null?'—':(s.margin*100).toFixed(1)+'%')+'</td><td class="'+riskClass(s.risk)+'">'+s.risk+'</td></tr>').join('')+'</table><p class="muted">※30/60/90日後の価格は取得データからの推定値で、販売を保証するものではありません。</p>'+(p.flags.length?'<h3>注意事項</h3><ul>'+p.flags.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>':'')+'<div style="margin-top:12px">'+(p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener">eBayの商品ページを開く</a>':'')+'</div><button class="secondary" onclick="closeDetail()">× 閉じる</button>';$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function closeDetail(e){if(e&&e.target!==$('modal'))return;$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('open'))closeDetail()});load();fx().finally(()=>{data=samples();updated=new Date().toLocaleString('ja-JP');render();$('status').innerHTML='<b>最終更新：</b>'+esc(updated)+'<br><b>データ：</b>サンプルデータ（「今すぐ更新」でeBayを取得）<br><b>為替：</b>'+fxRate.toFixed(2)+' USD/JPY'})
</script></body></html>
