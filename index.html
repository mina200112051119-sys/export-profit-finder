const fx=148,feeRate=.14;
function currentFeeRate(){const v=+document.getElementById('marketFee')?.value;if(Number.isFinite(v)&&v>=0)return v/100;return feeRate}
function productImage(p){return p.image?`<img class="detail-card-image" src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="image-fallback" style="display:none">商品画像は準備中です</div>`:`<div class="image-fallback">商品画像は準備中です</div>`}
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function renderCats(){let cats=[...new Set(products.map(p=>p.cat))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat" onclick="renderRank('${c}')"><b>${c}</b><small>${products.filter(p=>p.cat===c).length}件の試作商品</small></button>`).join('')}
function renderRank(cat){let arr=products.filter(p=>p.cat===cat).map(p=>({...p,profit:Math.round(p.sell*(1-currentFeeRate())-p.ship-p.cost)})).sort((a,b)=>b.profit-a.profit);document.getElementById('ranking').innerHTML=`<div class="card"><h2>${cat}のおすすめ</h2>${arr.map((p,i)=>`<div class="product" onclick="detail(products[${products.indexOf(p)}])"><div class="row"><span><span class="rank">#${i+1}</span> ${p.name}</span><b class="${p.profit>=0?'green':'red'}">${p.profit>=0?'+':''}${p.profit.toLocaleString()}円</b></div></div>`).join('')}</div>`}
function detail(p){let target=+document.getElementById('targetProfit').value||3000;let customSell=+document.getElementById('marketSell').value;let customShip=+document.getElementById('marketShip').value;let calcSell=customSell>0?customSell:p.sell;let calcShip=customShip>0?customShip:p.ship;let fee=currentFeeRate();let calcProfit=Math.round(calcSell*(1-fee)-calcShip-p.cost);let maxCost=Math.max(0,Math.floor(calcSell*(1-fee)-calcShip-target));let minSell=Math.max(0,Math.ceil((p.cost+calcShip+target)/(1-fee)));let safety=Math.round(((maxCost-p.cost)/Math.max(maxCost,1))*100);let levels=[0,-.1,-.2,-.3].map(x=>({price:Math.round(calcSell*(1+x)),profit:Math.round(calcSell*(1+x))*(1-fee)-calcShip-p.cost}));document.getElementById('detail').innerHTML=`<div class="card"><h2>商品詳細</h2>${productImage(p)}<h3>${p.name}</h3><div class="row"><span>仕入れ先</span><b>${p.source}</b></div><div class="row"><span>仕入れ価格</span><b>${p.cost.toLocaleString()}円</b></div><div class="row"><span>海外販売価格</span><b>${calcSell.toLocaleString()}円</b></div><div class="row"><span>海外送料</span><b>${calcShip.toLocaleString()}円</b></div><div class="row"><span>販売手数料率</span><b>${(fee*100).toFixed(1)}%</b></div><div class="row"><span>想定利益</span><b class="profit ${calcProfit>=0?'green':'red'}">${calcProfit>=0?'+':''}${calcProfit.toLocaleString()}円</b></div><div class="metric"><div>目標利益 ${target.toLocaleString()}円を残すための</div><b>仕入れ上限目安 ${maxCost.toLocaleString()}円</b><div class="muted" style="margin-top:6px">この金額以下なら、現在の想定販売価格・送料・手数料で目標利益を残せる計算です。</div></div><div class="metric" style="margin-top:10px"><div>🛒 仕入れ判断</div><b class="${p.cost<=maxCost?'green':'red'}">${p.cost<=maxCost?'買ってOK候補':'この価格では見送り'}</b><div class="muted" style="margin-top:6px">${p.cost<=maxCost?`仕入れ価格 ${p.cost.toLocaleString()}円は上限より ${(maxCost-p.cost).toLocaleString()}円安く、目標利益を残せる範囲です。`:`仕入れ価格 ${p.cost.toLocaleString()}円は上限を ${(p.cost-maxCost).toLocaleString()}円超えています。`}</div><div class="muted" style="margin-top:6px">上限に対する余裕：${safety}%</div></div><div class="metric"><div>🎯 この仕入れ価格で必要な最低販売価格</div><b>${minSell.toLocaleString()}円</b><div class="muted" style="margin-top:6px">目標利益 ${target.toLocaleString()}円を残すための最低ラインです。</div></div><div class="row"><span>過去90日の販売数</span><b>${p.sold}個</b></div><div class="row"><span>現在の出品数</span><b>${p.list}件</b></div><div class="row"><span>価格の動き</span><b>${p.trend}</b></div><h3 style="margin-top:18px">📉 値下げシミュレーション</h3>${levels.map(x=>`<div class="row"><span>${x.price.toLocaleString()}円</span><b class="${x.profit>=0?'green':'red'}">${x.profit>=0?'+':''}${x.profit.toLocaleString()}円</b></div>`).join('')}<h3 style="margin-top:18px">🔍 おすすめ理由</h3><p class="muted">販売実績があり、現在価格と仕入れ価格の差がある商品。値下げしても利益が残るため、試作上では上位候補です。</p><div class="notice"><b>最終判断：</b> AIの判定をそのまま仕入れ決定には使わず、販売実績・仕入れ状況・商品状態を確認してユーザーが判断します。</div><button class="primary" onclick="document.getElementById('detail').innerHTML=''">閉じる</button></div>`;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function normalizeSearch(s){return (s||"").toLowerCase().replace(/[\s　]+/g,"").replace(/[ー−‐-]/g,"")}
function marketQuery(){return document.getElementById('searchName').value.trim()||"商品名を入力"}
function openMarketSearch(){let q=marketQuery();let url='https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent(q);window.open(url,'_blank','noopener')}
async function copyMarketQuery(){let q=marketQuery();try{await navigator.clipboard.writeText(q);alert('検索ワードをコピーしました：\n'+q)}catch(e){alert('検索ワード：\n'+q)}}
function median(nums){nums=[...nums].sort((a,b)=>a-b);if(!nums.length)return 0;let m=Math.floor(nums.length/2);return nums.length%2?nums[m]:Math.round((nums[m-1]+nums[m])/2)}
function applyMarketMedian(){let nums=['marketP1','marketP2','marketP3','marketP4'].map(id=>+document.getElementById(id).value||0).filter(v=>v>0);let stats=document.getElementById('marketStats');if(nums.length<3){stats.textContent='3件以上の価格を入力してください。';return}let med=median(nums);document.getElementById('marketSell').value=med;stats.textContent=`確認件数：${nums.length}件｜最安：${Math.min(...nums).toLocaleString()}円｜中央値：${med.toLocaleString()}円｜最高：${Math.max(...nums).toLocaleString()}円`}
async function fetchEbayMarket(){let q=marketQuery();let status=document.getElementById('ebayApiStatus');let box=document.getElementById('ebayResults');status.textContent='eBay APIに問い合わせ中…';box.classList.add('hidden');let endpoint=window.EBAY_API_URL||'';if(!endpoint){status.textContent='API接続先がまだ設定されていません。今は「eBayで相場を確認」または手動入力を使えます。';return}try{let r=await fetch(endpoint+'?q='+encodeURIComponent(q));let data=await r.json();if(!r.ok)throw new Error(data.error||'APIエラー');let items=Array.isArray(data.items)?data.items:[];let fx=+(window.EXPORT_FX||148);let prices=items.map(x=>+(x.priceJpy||((+x.price||0)*fx))).filter(v=>v>0);let ships=items.map(x=>+(x.shippingJpy||((+x.shipping||0)*fx))).filter(v=>v>=0);if(!prices.length){status.textContent='eBayから価格を取得できませんでした。検索語を少し具体的にしてください。';return}let med=median(prices);document.getElementById('marketSell').value=med;if(ships.length)document.getElementById('marketShip').value=median(ships);['marketP1','marketP2','marketP3','marketP4'].forEach((id,i)=>{let el=document.getElementById(id);if(el)el.value=prices[i]?Math.round(prices[i]):''});box.classList.remove('hidden');box.innerHTML='<b>⚡ eBay API取得結果</b><div style="margin-top:6px">確認件数：'+prices.length+'件｜中央値：'+med.toLocaleString()+'円</div>'+items.slice(0,5).map(x=>'<div class="row"><span>'+(x.title||'商品')+'</span><b>'+Math.round(x.priceJpy||((+x.price||0)*fx)).toLocaleString()+'円</b></div>').join('');status.textContent='取得した中央値を「海外販売価格」に反映しました。'}catch(e){status.textContent='API接続に失敗しました：'+e.message+'（手動入力は引き続き使えます）'}}
function searchProduct(){let name=document.getElementById('searchName').value.trim()||"入力した商品";let cost=+document.getElementById('searchCost').value||0;let cat=document.getElementById('searchCat').value;let q=normalizeSearch(name);let tokens=q.split(/[^a-z0-9一-龯ぁ-んァ-ヶ]+/i).filter(Boolean);let pool=products.filter(p=>p.cat===cat);let scored=pool.map(p=>{let n=normalizeSearch(p.name);let score=0;if(n===q)score+=100;if(n.includes(q)||q.includes(n))score+=70;tokens.forEach(t=>{if(t&&n.includes(t))score+=20});return {...p,_score:score}}).filter(p=>p._score>0).sort((a,b)=>b._score-a._score);let candidates=scored.slice(0,6);let result=document.getElementById('searchResult');if(!candidates.length){result.innerHTML=`<div class="warning"><b>この試作データには一致する商品がありません。</b><br>でも問題ありません。完成版では、ここからeBay APIで候補商品を探す仕組みにします。</div><div class="notice">入力：${name}<br>カテゴリー：${cat}<br><br>今は「eBayで相場を確認」から実際のeBay検索もできます。</div>`;return}let cards=candidates.map((p,i)=>{let img=p.image?`<img class="search-product-image" src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">`:`<div class="search-product-placeholder">画像準備中</div>`;let match=p._score>=100?'完全一致候補':p._score>=70?'かなり近い候補':'キーワード一致';return `<div class="search-product-card">${img}<div class="rank">候補 ${i+1}　<span class="match-badge">${match}</span></div><h3>${p.name}</h3><div class="row"><span>仕入れ価格</span><b>${cost.toLocaleString()}円</b></div><div class="row"><span>参考販売価格</span><b>${p.sell.toLocaleString()}円</b></div><div class="row"><span>販売実績</span><b>${p.sold}個 / 90日</b></div><div class="small-grid" style="margin-top:8px"><button type="button" onclick="searchEbayForCandidate(${products.indexOf(p)})">🔎 eBay相場</button><button class="primary" type="button" onclick="selectSearchCandidate(${products.indexOf(p)},${cost})">この商品を選ぶ</button></div></div>`}).join('');result.innerHTML=`<div class="notice"><b>${candidates.length}件の候補が見つかりました。</b><br>① 商品が合っているか確認 → ② eBay相場を確認 → ③ 商品を選択、の順で進められます。</div><div class="search-product-grid">${cards}</div>`}
function searchEbayForCandidate(index){const p=products[index];const name=document.getElementById('searchName');if(name)name.value=p.name;const cat=document.getElementById('searchCat');if(cat)cat.value=p.cat;const result=document.getElementById('searchResult');result.innerHTML=`<div class="notice"><b>eBay相場確認：${p.name}</b><br>まずeBayの検索結果を開いて、同じ商品・状態に近い出品を確認してください。</div><div class="small-grid"><button type="button" onclick="openMarketSearch()">🔎 eBay検索を開く</button><button type="button" onclick="copyMarketQuery()">📋 検索ワードをコピー</button></div><div class="metric" style="margin-top:10px"><b>次のステップ</b><div class="muted" style="margin-top:6px">販売価格を確認したら、下の「商品を選ぶ」で利益計算へ進めます。API承認後はここを自動取得に切り替えます。</div><button class="primary" type="button" style="margin-top:8px" onclick="selectSearchCandidate(${index},${+document.getElementById('searchCost').value||0})">この商品を選んで利益計算</button></div>`}
function selectSearchCandidate(index,cost){let base=products[index];let p={...base,cost:cost||0};let sellInput=document.getElementById("marketSell");let shipInput=document.getElementById("marketShip");if(sellInput)sellInput.value=p.sell;if(shipInput)shipInput.value=p.ship;document.getElementById('searchResult').innerHTML=`<div class="notice"><b>「${p.name}」を選択しました。</b><br>この商品を基準に利益計算します。まず「⚡ eBay APIで取得」を試し、利用できない場合は「🔎 eBayで相場を確認」から実際の価格を確認してください。</div><div class="small-grid"><button type="button" onclick="openMarketSearch()">🔎 eBay相場を確認</button><button type="button" onclick="fetchEbayMarket()">⚡ eBay APIで取得</button></div>`;detail(p)}
function previewPhoto(e){const f=e.target.files[0];if(!f)return;const img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block';const box=document.getElementById('photoCandidate');box.classList.remove('hidden');box.innerHTML=`<div class="card"><h3>AIの商品候補（試作）</h3><p>画像から商品名・型番・カード番号などを読み取り、候補を表示します。</p><select><option>ポケモンカード 151 BOX（候補1）</option><option>別の商品候補（候補2）</option></select><button class="primary" onclick="confirmPhoto()">この商品で合っている</button></div>`}
function confirmPhoto(){let p=products[0];detail(p)}
renderCats();renderRank("ポケモンカード");
</script>
<script id="fuzzy-card-search-script">(function(){const svg=(title,subtitle,hue)=>{const s=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="hsl(${hue},75%,92%)"/><stop offset="1" stop-color="hsl(${(hue+35)%360},70%,72%)"/></linearGradient></defs><rect x="8" y="8" width="584" height="824" rx="34" fill="url(#g)" stroke="#222" stroke-width="8"/><rect x="35" y="35" width="530" height="80" rx="18" fill="white" opacity=".9"/><text x="55" y="84" font-size="34" font-family="sans-serif" font-weight="700">${title}</text><circle cx="300" cy="390" r="150" fill="white" opacity=".55"/><text x="300" y="385" text-anchor="middle" font-size="42" font-family="sans-serif" font-weight="700">${subtitle}</text><text x="300" y="430" text-anchor="middle" font-size="24" font-family="sans-serif">カード画像プレビュー</text><rect x="35" y="710" width="530" height="70" rx="15" fill="white" opacity=".9"/><text x="55" y="755" font-size="25" font-family="sans-serif">PROTOTYPE IMAGE</text></svg>`;return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(s)};const candidates=[{key:"リザードン 151",title:"ポケモンカード 151 リザードンex SAR",img:svg("POKEMON 151","リザードン",20),note:"名前＋収録弾の近似候補"},{key:"ピカチュウ 151",title:"ポケモンカード 151 ピカチュウ",img:svg("POKEMON 151","ピカチュウ",45),note:"名前＋収録弾の近似候補"},{key:"ミュウ 151",title:"ポケモンカード 151 ミュウ",img:svg("POKEMON 151","ミュウ",180),note:"名前＋収録弾の近似候補"},{key:"ナンジャモ",title:"ナンジャモ関連カード",img:svg("TRAINER","ナンジャモ",300),note:"人物名からの近似候補"}];const originalSearchProduct=window.searchProduct;function norm(s){return String(s||"").toLowerCase().replace(/[\s　]+/g,"")}window.searchProduct=function(){const input=document.getElementById("searchName");const q=norm(input?.value);const cat=document.getElementById("searchCat")?.value;if(cat==="ポケモンカード"){const hit=candidates.find(x=>q.includes(norm(x.key)));if(hit){const box=document.getElementById("searchResult");box.innerHTML=`<div class="notice"><b>画像・商品名の近似候補</b><br>${hit.note}</div><div class="fuzzy-candidates"><div class="fuzzy-card"><img src="${hit.img}" alt="${hit.title}"><div class="meta">候補1</div><h3>${hit.title}</h3><div class="meta">試作の候補表示です。実運用では商品データとeBay検索結果から候補を作ります。</div><button class="primary" onclick="document.getElementById('searchName').value='${hit.title.replace(/'/g,"\\'")}';document.getElementById('searchResult').innerHTML='';window.searchProduct=originalSearchProduct;window.searchProduct();">この候補を使う</button></div></div>`;return}}originalSearchProduct()}})();
</script>
