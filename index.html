<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export Profit Finder - 試作</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f5f6f8;color:#222}
header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}header p{margin:5px 0 0;font-size:12px;color:#cbd5e1}
main{max-width:900px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
button,.tab{border:0;border-radius:12px;padding:12px;background:white;box-shadow:0 1px 4px #0001;font-weight:700;cursor:pointer}
.tab.active{background:#111827;color:white}.panel{display:none}.panel.active{display:block}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cat{padding:16px;text-align:left}.cat small{display:block;color:#64748b;margin-top:4px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin:5px 0 10px}.small-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:12px;padding:12px;margin-top:10px}.metric b{font-size:18px}.warning{background:#fff7ed;color:#9a3412;padding:10px;border-radius:10px;font-size:12px;margin-top:10px}
.primary{background:#2563eb;color:white;width:100%;margin-top:4px}.muted{color:#64748b;font-size:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eee}.profit{font-size:26px;font-weight:800}.green{color:#15803d}.yellow{color:#a16207}.red{color:#b91c1c}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}
.stars{letter-spacing:2px}.rank{font-size:12px;color:#64748b}.product{cursor:pointer}.product:hover{transform:translateY(-1px)}
.notice{background:#eff6ff;padding:12px;border-radius:10px;font-size:13px;margin:10px 0}
.preview{max-height:180px;max-width:100%;border-radius:12px;margin-top:8px;display:none}
.result{margin-top:12px}.hidden{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.tabs{position:sticky;top:68px;background:#f5f6f8;padding:5px 0;z-index:4}}
.search-product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.search-product-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;box-shadow:0 1px 5px #0001}.search-product-card h3{min-height:42px;margin:8px 0}.search-product-image{width:100%;height:180px;object-fit:contain;border-radius:10px;background:#f5f5f5}.search-product-placeholder{height:180px;display:grid;place-items:center;background:#f5f5f5;border-radius:10px;color:#64748b}.search-product-card .primary{margin-top:10px}@media(max-width:600px){.search-product-grid{grid-template-columns:1fr}}
</style>
<style id="fuzzy-card-search-style">
.fuzzy-candidates{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:14px}.fuzzy-card{border:1px solid #ddd;border-radius:14px;padding:12px;background:#fff}.fuzzy-card img{width:100%;height:250px;object-fit:contain;border-radius:10px;background:#f5f5f5}.fuzzy-card .meta{font-size:13px;color:#666;margin:6px 0}.fuzzy-card button{width:100%;margin-top:8px}.match-badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eee;font-size:12px}.detail-card-image{width:min(100%,360px);max-height:520px;object-fit:contain;border-radius:14px;background:#f5f5f5;display:block;margin:10px auto}.image-fallback{padding:28px;text-align:center;background:#f5f5f8;border-radius:14px;color:#64748b;margin:10px auto}.search-hint{font-size:13px;color:#666;margin-top:6px}
</style>
</head>
<body>
<header><h1>Export Profit Finder</h1><p>輸出せどり支援ツール｜試作版・データはサンプルです</p></header>
<main>
<div class="tabs"><button class="tab active" onclick="showTab('recommend',this)">今おすすめ</button><button class="tab" onclick="showTab('search',this)">商品検索</button><button class="tab" onclick="showTab('photo',this)">写真から探す</button></div>
<section id="recommend" class="panel active"><div class="card"><h2>今おすすめの商品</h2><div class="notice">※試作版のため、現在の為替・eBay・仕入れ先データはサンプルです。実運用では最新データに更新します。</div><div class="grid" id="cats"></div></div><div class="card" style="margin-top:12px"><button class="primary" type="button" onclick="refreshRanking()">🔄 おすすめを更新</button><div id="rankingStatus" class="muted" style="margin-top:8px;text-align:center">サンプルデータでランキングを表示中</div></div><div id="ranking"></div></section>
<section id="search" class="panel"><div class="card"><h2>商品名・型番から検索</h2><label>カテゴリー</label><select id="searchCat"><option>ポケモンカード</option><option>ポケモン関連サプライ用品</option><option>釣具</option><option>カメラ</option><option>レトロゲーム</option></select><label>商品名・型番</label><input id="searchName" placeholder="例：ポケモンカード 151 BOX"><label>仕入れ価格（円）</label><input id="searchCost" type="number" value="8000"><label>目標利益（円）</label><input id="targetProfit" type="number" value="3000"><div class="notice">「目標利益」を残せる金額までを、仕入れ上限の目安として計算します。</div><button class="primary" onclick="searchProduct()">利益と仕入れ上限を計算する</button><div id="searchResult" class="result"></div></div></section>
<section id="photo" class="panel"><div class="card"><h2>写真から商品を探す</h2><div class="notice">写真をアップロード → 商品候補を確認 → ユーザーが確定、という安全設計の試作です。</div><input type="file" accept="image/*" onchange="previewPhoto(event)"><img id="preview" class="preview"><div id="photoCandidate" class="result hidden"></div></div></section>
<div id="detail"></div>
</main>
<script>
const products=[

{name:"ポケモンカード インフェルノX BOX",cat:"ポケモンカード",cost:6500,sell:11800,ship:1800,sold:61,list:27,trend:"上昇",source:"ヤフオク",risk:"低",image:"https://ec.treasure-f.com/images/1042009001663054/1500/1042009001663054_01_0500w.jpeg"},
{name:"ポケモンカード 30周年記念関連 BOX",cat:"ポケモンカード",cost:7200,sell:13500,ship:1800,sold:54,list:31,trend:"上昇",source:"ポケモンセンターオンライン",risk:"低",image:"https://www.pokemoncenter-online.com/a/img/item/9900000008284/M/a14cc0392043215b995fdbdd41d9aa81030b791a403cdebfbbb4e908e30a64e5.jpg"},
{name:"ポケモンカード 人気プロモカード",cat:"ポケモンカード",cost:4200,sell:7900,ship:900,sold:48,list:42,trend:"安定",source:"メルカリ",risk:"中"},
{name:"ポケモン デッキシールド 限定品",cat:"ポケモン関連サプライ用品",cost:2200,sell:7800,ship:1500,sold:46,list:18,trend:"上昇",source:"ポケモンセンターオンライン",risk:"低",image:"https://i.ebayimg.com/images/g/Y3gAAOSwjX9kPZkl/s-l500.jpg"},
{name:"ポケモン プレイマット 限定品",cat:"ポケモン関連サプライ用品",cost:3500,sell:9200,ship:2200,sold:39,list:17,trend:"安定",source:"ポケモンセンターオンライン",risk:"低"},
{name:"ポケモン デッキケース 限定品",cat:"ポケモン関連サプライ用品",cost:1800,sell:5200,ship:1500,sold:31,list:21,trend:"安定",source:"ポケモンセンターオンライン",risk:"中"},
{name:"ポケモン カードファイル",cat:"ポケモン関連サプライ用品",cost:2500,sell:5900,ship:1800,sold:28,list:25,trend:"安定",source:"メルカリ",risk:"中"},
{name:"ポケモン コレクション収納用品",cat:"ポケモン関連サプライ用品",cost:1600,sell:4800,ship:1500,sold:35,list:19,trend:"上昇",source:"ヤフオク",risk:"低"},
{name:"SHIMANO 人気リール",cat:"釣具",cost:18000,sell:31500,ship:4500,sold:43,list:26,trend:"安定",source:"ヤフオク",risk:"低",image:"https://stat.ameba.jp/user_images/20260523/18/e-shopstoyama/12/ef/j/o1080072015785336254.jpg?caw=800"},

{name:"日本限定フィッシングプライヤー",cat:"釣具",cost:5200,sell:9900,ship:1900,sold:29,list:16,trend:"上昇",source:"メルカリ",risk:"低"},
{name:"釣具用小型アクセサリー",cat:"釣具",cost:2400,sell:5200,ship:1400,sold:24,list:18,trend:"安定",source:"ヤフオク",risk:"中"},
{name:"Canon 人気フィルムカメラ",cat:"カメラ",cost:18000,sell:32000,ship:4500,sold:25,list:31,trend:"安定",source:"メルカリ",risk:"中",image:"https://cdn.assets.lomography.com/a1/3c928ad8ce813dd4f86d0d494db7236b3fd839/1216x972x2.jpg?auth=8fd0f67e3c8259226a76adfeefcb4d3903c1de81"},
{name:"Nikon 人気レンズ",cat:"カメラ",cost:22000,sell:41000,ship:4500,sold:34,list:24,trend:"上昇",source:"ヤフオク",risk:"低",image:"https://shop.topcamera.co.jp/site/html/upload/save_image/24571781.jpg"},
{name:"FUJIFILM 人気レンズ",cat:"カメラ",cost:28000,sell:52000,ship:5000,sold:29,list:22,trend:"上昇",source:"メルカリ",risk:"低",image:"https://www.fujiya-camera.co.jp/img/goods/L/C2120143687710_l.jpg"},
{name:"Sony ミラーレス用レンズ",cat:"カメラ",cost:24000,sell:43000,ship:4800,sold:27,list:25,trend:"安定",source:"ヤフオク",risk:"中"},
{name:"フィルムカメラ用レンズ",cat:"カメラ",cost:12000,sell:24500,ship:3500,sold:36,list:30,trend:"安定",source:"メルカリ",risk:"中"},
{name:"ゲームボーイ用 人気ソフト",cat:"レトロゲーム",cost:3500,sell:7500,ship:1800,sold:57,list:20,trend:"上昇",source:"ヤフオク",risk:"低"},
{name:"スーパーファミコン 人気ソフト",cat:"レトロゲーム",cost:2800,sell:6800,ship:1800,sold:49,list:24,trend:"上昇",source:"メルカリ",risk:"低"},
{name:"ファミコン 人気ソフト",cat:"レトロゲーム",cost:2600,sell:6200,ship:1800,sold:42,list:27,trend:"安定",source:"ヤフオク",risk:"中"},
{name:"セガサターン 人気ソフト",cat:"レトロゲーム",cost:3000,sell:7200,ship:1800,sold:35,list:22,trend:"安定",source:"メルカリ",risk:"中"},
{name:"ゲームボーイ本体 人気カラー",cat:"レトロゲーム",cost:9000,sell:18500,ship:2500,sold:31,list:18,trend:"上昇",source:"ヤフオク",risk:"低"}
];
const feeRate=.14,fx=148;
function currentFeeRate(){const x=document.getElementById('marketFee');return x?Number(x.value)/100:feeRate}
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));const p=document.getElementById(id);if(p)p.classList.add('active');if(btn)btn.classList.add('active')}
const rankingState={data:products,source:'試作サンプル',updatedAt:new Date()};
function rankingScore(p){const fee=currentFeeRate();const profit=Math.round(p.sell*(1-fee)-p.ship-p.cost);const margin=p.cost>0?profit/p.cost:0;const demand=p.sold/Math.max(p.list,1);const trend=p.trend==='上昇'?1:0;const risk=p.risk==='低'?1:p.risk==='中'?.5:0;return{profit,margin,demand,score:profit/1000+Math.min(demand,4)*1.5+trend*2+risk}}
function rankedItems(list){return list.map(p=>({...p,...rankingScore(p)})).sort((a,b)=>b.score-a.score)}
const rankingState={data:products,source:"試作サンプル",updatedAt:new Date()};
function rankingScore(p){const fee=currentFeeRate();const profit=Math.round(p.sell*(1-fee)-p.ship-p.cost);const margin=p.cost>0?profit/p.cost:0;const demand=p.sold/Math.max(p.list,1);const trend=p.trend==="上昇"?1:0;const risk=p.risk==="低"?1:p.risk==="中"?.5:0;return {profit,margin,demand,score:profit/1000+Math.min(demand,4)*1.5+trend*2+risk}}
function rankedItems(list){return list.map(p=>({...p,...rankingScore(p)})).sort((a,b)=>b.score-a.score)}
function renderCats(){let cats=[...new Set(rankingState.data.map(p=>p.cat))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat" onclick="renderRank('${c}')"><b>${c}</b><small>${rankingState.data.filter(p=>p.cat===c).length}件｜おすすめを見る</small></button>`).join('')}
function rankingCard(p,i){return `<div class="card product" role="button" tabindex="0" onclick="detailByName(${JSON.stringify(p.name)})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();detailByName(${JSON.stringify(p.name)})}"><span class="rank">#${i+1}</span> <span class="badge">${i<3?'注目候補':'おすすめ候補'}</span><h3>${p.name}</h3><div class="row"><span>予想利益</span><b class="${p.profit>=0?'green':'red'}">${p.profit>=0?'+':''}${p.profit.toLocaleString()}円</b></div><div class="row"><span>販売・出品比</span><b>${Math.round(p.demand*100)}%</b></div><div class="row"><span>リスク</span><b>${p.risk}</b></div><div class="muted" style="margin-top:8px;text-align:right">タップして詳細を見る ›</div></div>`}
function renderOverallRank(){const arr=rankedItems(rankingState.data).slice(0,10);document.getElementById('ranking').innerHTML=`<div class="card"><h2>全カテゴリー｜おすすめTOP10</h2><p class="muted">順位は「利益・売れやすさ・価格の動き・リスク」を組み合わせた試作スコアです。完成版では最新データを同じ計算に流し込みます。</p>${arr.map(rankingCard).join('')}</div>`}
function renderRank(cat){const arr=rankedItems(rankingState.data.filter(p=>p.cat===cat));document.getElementById('ranking').innerHTML=`<div class="card"><h2>${cat}｜おすすめ</h2><p class="muted">この順位計算は、あとで最新のeBay等のデータを入れ替えられるように分離しています。</p>${arr.map(rankingCard).join('')}</div>`}
async function loadRankingData(){const url=window.RANKING_DATA_URL||'';if(!url){rankingState.data=products;rankingState.source='試作サンプル';rankingState.updatedAt=new Date();return false}const r=await fetch(url);if(!r.ok)throw new Error('ランキングデータ取得に失敗しました');const data=await r.json();const items=Array.isArray(data.items)?data.items:[];if(!items.length)throw new Error('ランキングデータが空です');rankingState.data=items;rankingState.source=data.source||'外部データ';rankingState.updatedAt=new Date();return true}
async function refreshRanking(){const status=document.getElementById('rankingStatus');status.textContent='おすすめデータを更新しています…';try{const live=await loadRankingData();renderCats();renderOverallRank();const t=rankingState.updatedAt.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});status.textContent=`データ：${rankingState.source}${live?'（外部取得）':'（試作）'}｜最終更新：${t}`}catch(e){rankingState.data=products;renderCats();renderOverallRank();status.textContent=`最新データ取得に失敗しました。試作データを表示中｜${e.message}`}}
function detailByName(name){const p=rankingState.data.find(x=>x.name===name)||products.find(x=>x.name===name);if(p)detail(p)}
function detail(p){const d=document.getElementById('detail');const fee=currentFeeRate();const profit=Math.round(p.sell*(1-fee)-p.ship-p.cost);const lower=Math.round((p.sell*.9)*(1-fee)-p.ship-p.cost);d.innerHTML=`<div class="card"><button type="button" onclick="document.getElementById('detail').innerHTML='';document.getElementById('ranking').scrollIntoView({behavior:'smooth',block:'start'})">← 一覧に戻る</button>${p.image?`<img class="detail-card-image" src="${p.image}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="image-fallback" style="display:none">商品画像を表示できませんでした</div>`:''}<h2>${p.name}</h2><div class="badge">${p.risk==='低'?'おすすめ候補':'要確認'}</div><div class="metric"><span>予想利益</span><div class="profit ${profit>=0?'green':'red'}">${profit>=0?'+':''}${profit.toLocaleString()}円</div></div><div class="row"><span>仕入れ価格</span><b>${p.cost.toLocaleString()}円</b></div><div class="row"><span>eBay想定販売価格</span><b>${p.sell.toLocaleString()}円</b></div><div class="row"><span>送料</span><b>${p.ship.toLocaleString()}円</b></div><div class="row"><span>販売手数料</span><b>${Math.round(fee*100)}%</b></div><div class="row"><span>直近90日販売数</span><b>${p.sold}件</b></div><div class="row"><span>現在の出品数</span><b>${p.list}件</b></div><div class="row"><span>販売・出品比</span><b>${Math.round(p.sold/Math.max(p.list,1)*100)}%</b></div><div class="row"><span>価格トレンド</span><b>${p.trend}</b></div><div class="metric"><span>販売価格が10%下がった場合</span><br><b class="${lower>=0?'green':'red'}">${lower>=0?'+':''}${lower.toLocaleString()}円</b></div><div class="notice">おすすめ理由：${p.trend==='上昇'?'価格が上向きで、':'価格が安定していて、'}販売数と出品数のバランス、予想利益、リスクを合わせて判断しています。仕入れ前に実際の販売履歴・状態・送料を確認してください。</div><div class="warning">この数値は試作データによる目安です。実運用では最新のeBay等のデータに置き換えます。</div></div>`;d.scrollIntoView({behavior:'smooth',block:'start'})}
function searchProduct(){const q=document.getElementById('searchName').value.trim();const cat=document.getElementById('searchCat').value;const cost=Number(document.getElementById('searchCost').value||0);const target=Number(document.getElementById('targetProfit').value||0);const fee=currentFeeRate();const candidates=products.filter(p=>p.cat===cat&&(!q||p.name.toLowerCase().includes(q.toLowerCase()))).slice(0,6);const maxSell=candidates.length?Math.max(...candidates.map(p=>p.sell)):0;const limit=Math.floor(maxSell*(1-fee)-1800-target);document.getElementById('searchResult').innerHTML=`<div class="notice">候補：${candidates.length}件｜目標利益を残す仕入れ上限の目安：${Math.max(0,limit).toLocaleString()}円</div>${candidates.map((p,i)=>`<div class="search-product-card"><h3>${p.name}</h3><div class="row"><span>サンプル販売価格</span><b>${p.sell.toLocaleString()}円</b></div><button class="primary" type="button" onclick="detailByName(${JSON.stringify(p.name)})">この商品を詳しく見る</button></div>`).join('')||'<div class="notice">候補が見つかりませんでした。</div>'}`}
function previewPhoto(e){const f=e.target.files?.[0];if(!f)return;const img=document.getElementById('preview');img.src=URL.createObjectURL(f);img.style.display='block';document.getElementById('photoCandidate').classList.remove('hidden');document.getElementById('photoCandidate').innerHTML='<div class="notice">写真を受け取りました。AI候補判定は次の段階で実装します。現在は商品候補を選択する試作です。</div><button class="primary" type="button" onclick="detail(products[0])">候補を表示</button>'}
renderCats();renderOverallRank();refreshRanking();
</script>
</body></html>
